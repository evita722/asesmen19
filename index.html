            if (multiPilih) {
              const arr = Array.isArray(s.kunci) ? s.kunci : [];
              s.kunci = arr.includes(idx) ? arr.filter(v => v !== idx) : [...arr, idx];
            } else {
              s.kunci = idx;
            }
            gambarSoal();
          });
          opsiWrap.appendChild(label);
          });
        }
        // Editor "Tabel Benar-Salah" — daftar pernyataan dinamis (bisa
        // ditambah/dihapus), masing-masing punya toggle kunci BENAR/SALAH
        // sendiri. Dipakai HANYA saat tipe soal ini "tbs".
        const pernyataanWrap = el("div", { style: "margin-bottom:6px;" });
        if (tabelBS) {
          if (!Array.isArray(s.pernyataan)) s.pernyataan = [];
          s.pernyataan.forEach((p, idx) => {
            const previewP = el("div", { class: "muted", style: "font-size:.8em; margin-top:2px; overflow-x:auto; max-width:100%;" });
            function perbaruiPreviewP() { previewP.innerHTML = formatTeksKeHtml(p.teks || ""); renderMatematika(previewP); }
            const inputP = el("input", { class: "qi", placeholder: `Pernyataan ${idx + 1}`, value: p.teks, oninput: (e) => { p.teks = e.target.value; perbaruiPreviewP(); } });
            const toolbarP = buatToolbarTeks(inputP, (nilaiBaru) => { p.teks = nilaiBaru; perbaruiPreviewP(); });
            perbaruiPreviewP();
            const toggleBenar = el("button", { type: "button", class: `btn ${p.kunci ? "btn-primary" : ""}`, style: "padding:.35em .8em; font-size:.78em;", onclick: () => { p.kunci = true; gambarSoal(); } }, "BENAR");
            const toggleSalah = el("button", { type: "button", class: `btn ${!p.kunci ? "btn-primary" : ""}`, style: "padding:.35em .8em; font-size:.78em;", onclick: () => { p.kunci = false; gambarSoal(); } }, "SALAH");
            const hapusP = s.pernyataan.length > 2
              ? el("button", { class: "btn", style: "padding:.2em .5em; color:var(--red); border-color:var(--red);", onclick: () => { s.pernyataan.splice(idx, 1); gambarSoal(); } }, "×")
              : el("span");
            pernyataanWrap.appendChild(el("div", { class: "row", style: "gap:8px; align-items:flex-start; margin-bottom:10px; padding-bottom:10px; border-bottom:1px dashed var(--paper-line);" },
              el("span", { class: "mono muted", style: "padding-top:.5em;" }, HURUF[idx] + "."),
              el("div", { style: "flex:1; min-width:0;" }, toolbarP, inputP, previewP),
              el("div", { class: "row", style: "gap:4px; flex-shrink:0;" }, toggleBenar, toggleSalah, hapusP)
            ));
          });
          pernyataanWrap.appendChild(el("button", { type: "button", class: "btn", style: "font-size:.8em;", onclick: () => { s.pernyataan.push(pernyataanKosong()); gambarSoal(); } }, "+ Tambah Pernyataan"));
        }

        const hapusBtn = state.soal.length > 1
          ? el("button", { class: "btn", style: "padding:.2em .5em; color:var(--red); border-color:var(--red)", onclick: () => { state.soal.splice(i, 1); gambarSoal(); } }, "×")
          : el("span");
        daftar.appendChild(el("div", { style: "border:1.5px solid var(--paper-line); border-radius:5px; padding:14px; margin-bottom:14px;" },
          el("div", { class: "between", style: "margin-bottom:8px;" },
            el("span", { class: "mono muted", style: "font-weight:600;" }, `No.${i + 1}`), hapusBtn
          ),
          el("div", { style: "margin-bottom:10px;" }, teksToolbar, teksArea, teksPreview),
          gambarBlok,
          el("div", { class: "row", style: "gap:14px; margin-bottom:10px; flex-wrap:wrap; align-items:flex-end;" },
            el("div", {}, el("label", { class: "field" }, "Tipe Soal"), tipeSelect),
            el("div", {}, el("label", { class: "field" }, "Bobot (poin)"), bobotInput, el("div", { class: "muted", style: "font-size:.72em; margin-top:2px;" }, "1–100"))
          ),
          opsiWrap,
          pernyataanWrap,
          el("p", { style: "font-size:.75em; color:var(--gold); margin:8px 0 0;" },
            tabelBS ? "Klik BENAR/SALAH untuk menandai kunci tiap pernyataan. Skor soal ini dihitung sebagian (proporsional) sesuai jumlah pernyataan yang dijawab benar." :
            multiPilih ? "Tandai (✓) semua pilihan yang benar — bisa lebih dari satu." : "Bulatan yang disorot menandai jawaban benar.")
        ));
      });
    }
    gambarSoal();
    wrap.appendChild(daftar);
    wrap.appendChild(el("button", { class: "btn", onclick: () => { state.soal.push({ teks: "", opsi: [opsiKosong(), opsiKosong(), opsiKosong(), opsiKosong()], kunci: 0, tipe: "pg", bobot: 1 }); gambarSoal(); } }, "+ Tambah Soal"));
    return wrap;
  }

  function langkah4() {
    const wrap = el("div", {});
    wrap.appendChild(el("h3", { class: "disp", style: "margin-top:0;" }, modeEdit ? "Tinjau & Simpan" : "Tinjau & Buat"));
    const grid = el("div", { class: "grid2", style: "margin-bottom:20px; font-size:.9em;" });
    const item = (label, val) => el("div", {}, el("div", { class: "muted" }, label), el("div", { class: "disp", style: "font-size:1.2em;" }, String(val)));
    grid.appendChild(item("Mapel", state.mapel || "—"));
    grid.appendChild(item("Jenjang", state.jenjang ? `Kelas ${state.jenjang}` : "—"));
    grid.appendChild(item("Waktu", `${state.waktuMenit} menit`));
    grid.appendChild(item("Jumlah Siswa", `${state.siswa.length} siswa`));
    grid.appendChild(item("Jumlah Soal", `${state.soal.length} soal`));
    grid.appendChild(item("Skor Maksimal", `${state.soal.reduce((total, s) => total + (Number(s.bobot) || 1), 0)} poin`));
    wrap.appendChild(grid);

    wrap.appendChild(el("button", { class: "btn btn-block", style: "margin-bottom:14px;", onclick: () => {
      halamanPratinjauMurid({ mapel: state.mapel, jenjang: state.jenjang, waktuMenit: state.waktuMenit, soal: state.soal }, () => { gambar(); });
    }}, "👁 Pratinjau sebagai Murid"));

    if (modeEdit) {
      wrap.appendChild(el("div", { class: "warn-box", style: "margin-bottom:14px; background:var(--paper);" },
        el("span", {}, "ℹ"),
        el("p", { style: "margin:0;" }, "Progres & jawaban siswa yang sudah ada akan tetap dipertahankan sebisa mungkin. Kalau kamu menghapus siswa atau soal, data terkait mereka ikut hilang (memang bagian dari penghapusan itu). Kalau kamu mengubah kunci jawaban suatu soal SETELAH ada siswa yang sudah selesai mengerjakan, skor mereka otomatis dihitung ulang memakai kunci yang baru.")
      ));
    }

    const status = el("p", { class: "muted", style: "font-size:.85em;" });
    const tombol = el("button", { class: "btn btn-red btn-block", onclick: async () => {
      if (modeEdit && !confirm("Simpan perubahan sekarang?")) return;
      tombol.disabled = true; tombol.textContent = modeEdit ? "Menyimpan…" : "Membuat kode asesmen…";
      try {
        const hasil = modeEdit
          ? await panggilAPI("updateAssessment", {
              code: existing.code, mapel: state.mapel, jenjang: state.jenjang, waktuMenit: state.waktuMenit,
              acakSoal: state.acakSoal, acakOpsi: state.acakOpsi, jadwalMulai: state.jadwalMulai, wajibLengkap: state.wajibLengkap,
              siswa: state.siswa, soal: state.soal,
            })
          : await panggilAPI("createAssessment", {
              mapel: state.mapel, jenjang: state.jenjang, waktuMenit: state.waktuMenit,
              acakSoal: state.acakSoal, acakOpsi: state.acakOpsi, jadwalMulai: state.jadwalMulai, wajibLengkap: state.wajibLengkap,
              siswa: state.siswa, soal: state.soal,
            });
        if (!hasil.ok) { status.textContent = hasil.error || "Gagal menyimpan asesmen."; tombol.disabled = false; tombol.textContent = "Coba Lagi"; return; }
        halamanDashboard(modeEdit ? existing.code : hasil.code);
      } catch (err) {
        status.textContent = "Gagal terhubung ke server: " + err;
        tombol.disabled = false; tombol.textContent = "Coba Lagi";
      }
    }}, modeEdit ? "Simpan Perubahan" : "Buat Asesmen & Dapatkan Kode");
    wrap.appendChild(tombol);
    wrap.appendChild(status);
    return wrap;
  }

  gambar();
}

/* =========================================================
   6b) GURU — PRATINJAU SOAL DARI SUDUT PANDANG MURID
   Tampilan ini sengaja disamakan persis dengan halaman pengerjaan murid
   (satu soal per layar, gaya CBT), tapi tanpa kunci jawaban ditampilkan,
   tanpa deteksi kecurangan, dan tidak ada apa pun yang dikirim/disimpan
   ke server — murni untuk pengecekan guru sebelum/actual asesmen dipakai.
   ========================================================= */
function halamanPratinjauMurid(data, kembali) {
  const soalList = (data.soal || []).filter(s => s && s.teks);
  let index = 0;
  let drawerTerbuka = false;
  const jawabanLokal = {};
  const rootNode = el("div", {});
  render(rootNode, { noHeader: true }); // punya .examhead sendiri, header portal tidak dipakai di sini

  function gambarSoal() {
    rootNode.innerHTML = "";
    if (!soalList.length) {
      rootNode.appendChild(el("div", { class: "center" },
        el("div", { class: "card", style: "max-width:420px; text-align:center;" },
          el("p", {}, "Belum ada soal yang lengkap untuk dipratinjau."),
          el("button", { class: "btn", style: "margin-top:12px;", onclick: kembali }, "← Kembali")
        )
      ));
      return;
    }

    rootNode.appendChild(el("div", { class: "examhead" },
      el("span", { class: "stamp", style: "color:#fff; border-color:rgba(255,255,255,.5); margin-bottom:8px;" }, "👁 Mode Pratinjau"),
      el("div", { class: "examhead-top" },
        elTombolTogglSoal(() => { drawerTerbuka = !drawerTerbuka; gambarSoal(); }),
        el("img", { src: LOGO_SEKOLAH_B64, alt: "Logo Sekolah", class: "examhead-logo" }),
        el("div", { class: "examhead-text" },
          el("div", { class: "eyebrow" }, "Asesmen Sumatif"),
          el("div", { class: "mapel" }, data.mapel || "(Tanpa Mapel)"),
          data.jenjang ? el("div", { class: "siswa", style: "font-size:1.1em;" }, `Kelas ${data.jenjang}`) : el("span")
        )
      ),
      el("div", { class: "timer-chip" }, `${data.waktuMenit || 0} mnt`)
    ));

    const inner = el("div", { class: "wrap", style: "max-width:680px;" });
    inner.appendChild(elBannerKatex());
    inner.appendChild(el("div", { class: "warn-box", style: "margin-bottom:16px; background:var(--gold-soft);" },
      el("span", {}, "ℹ"),
      el("p", { style: "margin:0;" }, "Ini persis tampilan yang akan dilihat murid. Jawaban di sini tidak disimpan, dan kunci jawaban tidak pernah ditampilkan di layar murid maupun di pratinjau ini.")
    ));

    const s = soalList[index];
    const kompleks = s.tipe === "pgk";
    const matriks = s.tipe === "tbs";
    const urutanOpsi = matriks ? [] : s.opsi.map((_, i) => i); // pratinjau: urutan asli, tidak diacak
    const dipilih = jawabanLokal[index];
    const dipilihArr = kompleks ? (Array.isArray(dipilih) ? dipilih : []) : null;
    const jumlahPernyataan = matriks ? (s.pernyataan || []).length : 0;
    const dipilihMatriks = matriks ? (Array.isArray(dipilih) ? dipilih : new Array(jumlahPernyataan).fill(null)) : null;

    inner.appendChild(el("div", { class: "between muted", style: "font-size:.8em; margin-bottom:10px;" },
      el("span", {}, `Soal ${index + 1} dari ${soalList.length} · ${Number(s.bobot) || 1} poin`),
      el("span", {}, kompleks ? "Pilihan Ganda Kompleks" : (s.tipe === "bs" ? "Benar/Salah" : (matriks ? "Tabel Benar-Salah" : "Pilihan Ganda")))
    ));

    const qcard = el("div", { class: "qcard" },
      el("div", { class: "row", style: "align-items:flex-start; margin-bottom:4px;" },
        el("span", { class: "mono muted", style: "font-weight:600;" }, `${index + 1}.`),
        el("p", { style: "margin:0; font-weight:500; flex:1; min-width:0;", html: formatTeksKeHtml(s.teks) })
      ),
      elGambarDenganCadangan("gambar-soal", s, "margin-left:22px; max-width:calc(100% - 22px);"),
      kompleks ? el("p", { class: "muted", style: "font-size:.75em; margin:0 0 10px 22px;" }, "Pilih satu atau lebih jawaban.") :
        matriks ? el("p", { class: "muted", style: "font-size:.75em; margin:0 0 10px 22px;" }, "Tentukan BENAR atau SALAH untuk setiap pernyataan.") : el("span")
    );
    if (matriks) {
      const tabelWrap = el("div", { style: "overflow-x:auto; margin-left:22px;" });
      const tabel = el("table", {},
        el("tr", {},
          el("th", {}, "Pernyataan"),
          el("th", { style: "text-align:center; width:64px;" }, "BENAR"),
          el("th", { style: "text-align:center; width:64px;" }, "SALAH")
        )
      );
      (s.pernyataan || []).forEach((p, idx) => {
        const nilai = dipilihMatriks[idx];
        const tdBenar = el("td", {
          style: "text-align:center; cursor:pointer;",
          onclick: () => { dipilihMatriks[idx] = true; jawabanLokal[index] = dipilihMatriks.slice(); gambarSoal(); },
        }, el("span", { class: `radio ${nilai === true ? "pilih" : ""}` }));
        const tdSalah = el("td", {
          style: "text-align:center; cursor:pointer;",
          onclick: () => { dipilihMatriks[idx] = false; jawabanLokal[index] = dipilihMatriks.slice(); gambarSoal(); },
        }, el("span", { class: `radio ${nilai === false ? "pilih" : ""}` }));
        tabel.appendChild(el("tr", {},
          el("td", { style: "white-space:normal; text-align:left;" }, el("span", { html: `${HURUF[idx]}. ${formatTeksKeHtml(p.teks)}` })),
          tdBenar, tdSalah
        ));
      });
      tabelWrap.appendChild(tabel);
      qcard.appendChild(tabelWrap);
    } else {
      const opsiGrid = el("div", { style: "display:grid; gap:2px;" });
      urutanOpsi.forEach((idxAsli, posisi) => {
        const terpilih = kompleks ? dipilihArr.includes(idxAsli) : dipilih === idxAsli;
        const opsiObj = normalisasiOpsiFE(s.opsi[idxAsli]);
        const label = el("label", { class: `opsi ${terpilih ? "pilih" : ""}`, style: "align-items:flex-start;" },
          el("span", { class: "opsi-letter" }, `${HURUF[posisi]}.`),
          el("span", { class: `radio ${kompleks ? "kotak" : ""} ${terpilih ? "pilih" : ""}` }),
          el("div", { style: "flex:1; min-width:0;" },
            opsiObj.teks ? el("span", { class: "opsi-teks", html: formatTeksKeHtml(opsiObj.teks) }) : el("span"),
            elGambarDenganCadangan("gambar-opsi", opsiObj)
          )
        );
        label.addEventListener("click", () => {
          if (kompleks) {
            const sudahAda = Array.isArray(jawabanLokal[index]) ? jawabanLokal[index] : [];
            jawabanLokal[index] = sudahAda.includes(idxAsli) ? sudahAda.filter(v => v !== idxAsli) : [...sudahAda, idxAsli];
          } else {
            jawabanLokal[index] = idxAsli;
          }
          gambarSoal();
        });
        opsiGrid.appendChild(label);
      });
      qcard.appendChild(opsiGrid);
    }
    inner.appendChild(qcard);
    renderMatematika(qcard);

    inner.appendChild(el("div", { class: "navseg", style: "margin-bottom:14px;" },
      el("button", { disabled: index === 0 ? "true" : null, onclick: () => { index--; gambarSoal(); } },
        el("span", {}, "←"), el("span", {}, "Sebelumnya")),
      el("button", { disabled: index === soalList.length - 1 ? "true" : null, onclick: () => { index++; gambarSoal(); } },
        el("span", {}, "Berikutnya"), el("span", {}, "→"))
    ));
    inner.appendChild(el("button", { class: "btn btn-red btn-block", onclick: kembali }, "← Tutup Pratinjau"));

    rootNode.appendChild(inner);

    const { overlay, drawer } = elDrawerNomorSoal({
      jumlah: soalList.length,
      terjawabFn: (i) => {
        const soalI = soalList[i];
        return soalI && soalI.tipe === "pgk" ? Array.isArray(jawabanLokal[i]) && jawabanLokal[i].length > 0 : jawabanLokal[i] !== undefined;
      },
      statusFn: () => null,
      aktifIndex: index,
      onPilih: (i) => { index = i; drawerTerbuka = false; gambarSoal(); },
      terbuka: drawerTerbuka,
      onTutup: () => { drawerTerbuka = false; gambarSoal(); },
      tombolBawah: el("button", { class: "btn btn-red btn-block", onclick: kembali }, "← Tutup Pratinjau"),
    });
    rootNode.appendChild(overlay);
    rootNode.appendChild(drawer);
  }

  gambarSoal();
}

/* =========================================================
   7) GURU — DASHBOARD (real-time, plus tautan spreadsheet)
   ========================================================= */
function halamanDashboard(code) {
  let timer = null;
  const container = el("div", { class: "wrap" });
  render(container);

  async function muat() {
    const hasil = await panggilAPI("getResults", { code });
    container.innerHTML = "";
    if (!hasil.ok) {
      container.appendChild(el("button", { class: "btn", style: "margin-bottom:20px;", onclick: () => { clearInterval(timer); halamanGuruBeranda(); } }, "← Kembali"));
      container.appendChild(el("p", {}, hasil.error || "Terjadi kesalahan."));
      clearInterval(timer);
      return;
    }
    const { assessment, baris } = hasil;
    const selesai = baris.filter(b => b.status === "Selesai").length;
    const mengerjakan = baris.filter(b => b.status === "Mengerjakan").length;
    const totalKecurangan = baris.reduce((a, b) => a + (b.pindahTab||0) + (b.copy||0) + (b.paste||0) + (b.klikKanan||0) + (b.keluarFullscreen||0), 0);

    container.appendChild(el("button", { class: "btn", style: "margin-bottom:20px;", onclick: () => { clearInterval(timer); halamanGuruBeranda(); } }, "← Asesmen Saya"));

    const INDIKATOR_LABEL = { terjadwal: "● Terjadwal", aktif: "● Langsung", dijeda: "● Dijeda", ditutup: "● Ditutup" };
    const INDIKATOR_WARNA = { terjadwal: "var(--gold)", aktif: "var(--green)", dijeda: "var(--gold)", ditutup: "var(--red)" };
    container.appendChild(el("div", { class: "card between", style: "margin-bottom:18px;" },
      el("div", {},
        el("div", { class: "row", style: "margin-bottom:4px;" },
          el("span", { style: `color:${INDIKATOR_WARNA[assessment.status] || "var(--ink-soft)"}; font-weight:700; font-size:.75em; text-transform:uppercase;` }, INDIKATOR_LABEL[assessment.status] || assessment.status),
          assessment.jenjang ? el("span", { class: "stamp", style: "color:var(--ink-soft);" }, `Kelas ${assessment.jenjang}`) : el("span")
        ),
        el("h2", { class: "disp", style: "margin:0;" }, assessment.mapel),
        el("p", { class: "muted", style: "font-size:.85em;" }, `${assessment.totalSoal} soal · ${assessment.waktuMenit} menit · ${baris.length} siswa`)
      ),
      el("div", { style: "text-align:right;" },
        el("div", { class: "muted", style: "font-size:.75em;" }, "Kode Asesmen"),
        el("div", { class: "mono", style: "font-size:1.6em; font-weight:700; color:var(--blue);" }, code)
      )
    ));

    const statCard = (label, val, color) => el("div", { class: "card", style: "padding:14px;" },
      el("div", { class: "disp", style: `font-size:1.6em; color:${color || "var(--ink)"}` }, String(val)),
      el("div", { class: "muted", style: "font-size:.75em;" }, label)
    );
    container.appendChild(el("div", { style: "display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px;" },
      statCard("Total Siswa", baris.length),
      statCard("Mengerjakan", mengerjakan, "var(--gold)"),
      statCard("Selesai", selesai, "var(--green)"),
      statCard("Indikasi Kecurangan", totalKecurangan, "var(--red)")
    ));

    const STATUS_LABEL = {
      terjadwal: `Terjadwal — ${assessment.jadwalMulai ? new Date(assessment.jadwalMulai).toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" }) : "-"}`,
      aktif: "Menerima Peserta Baru",
      dijeda: "Dijeda Sementara",
      ditutup: "Ditutup",
    };
    const STATUS_WARNA = { terjadwal: "var(--gold)", aktif: "var(--green)", dijeda: "var(--gold)", ditutup: "var(--red)" };

    async function ubahStatus(statusBaru) {
      await panggilAPI("setStatus", { code, status: statusBaru });
      muat();
    }
    // Tombol aksi status berbeda-beda tergantung kondisi saat ini:
    // - terjadwal -> bisa dibuka paksa sekarang (melewati jadwal)
    // - aktif     -> bisa dijeda (berhenti seketika) atau ditutup (permanen)
    // - dijeda    -> bisa dilanjutkan lagi, atau langsung ditutup
    // - ditutup   -> bisa dibuka kembali seperti semula
    const tombolStatus = [];
    if (assessment.status === "terjadwal") {
      tombolStatus.push(el("button", { class: "btn", onclick: () => ubahStatus("aktif") }, "Buka Sekarang"));
    }
    if (assessment.status === "aktif") {
      tombolStatus.push(el("button", { class: "btn", onclick: () => ubahStatus("dijeda") }, "Jeda Ujian"));
      tombolStatus.push(el("button", { class: "btn btn-red-outline", onclick: () => ubahStatus("ditutup") }, "Tutup Asesmen"));
    }
    if (assessment.status === "dijeda") {
      tombolStatus.push(el("button", { class: "btn", onclick: () => ubahStatus("aktif") }, "Lanjutkan Ujian"));
      tombolStatus.push(el("button", { class: "btn btn-red-outline", onclick: () => ubahStatus("ditutup") }, "Tutup Asesmen"));
    }
    if (assessment.status === "ditutup") {
      tombolStatus.push(el("button", { class: "btn", onclick: () => ubahStatus("aktif") }, "Buka Kembali"));
    }

    container.appendChild(el("div", { class: "between", style: "margin-bottom:10px; flex-wrap:wrap; gap:8px;" },
      el("span", { class: "stamp", style: `color:${STATUS_WARNA[assessment.status] || "var(--ink-soft)"}` }, STATUS_LABEL[assessment.status] || assessment.status),
      el("div", { class: "row" },
        el("a", { class: "btn", href: assessment.sheetUrl, target: "_blank", style: "text-decoration:none;" }, "Buka di Google Sheets"),
        el("button", { class: "btn", onclick: async (e) => {
          const btn2 = e.currentTarget; btn2.disabled = true; btn2.textContent = "Memuat…";
          const hasil = await panggilAPI("getAssessmentDetail", { code, untukPratinjau: true });
          btn2.disabled = false; btn2.textContent = "Pratinjau sebagai Murid";
          if (!hasil.ok) { alert(hasil.error || "Gagal memuat soal."); return; }
          clearInterval(timer);
          halamanPratinjauMurid(
            { mapel: hasil.mapel, waktuMenit: hasil.waktuMenit, soal: hasil.soal },
            () => halamanDashboard(code)
          );
        }}, "Pratinjau sebagai Murid"),
        el("button", { class: "btn", onclick: () => { clearInterval(timer); halamanAnalitikSoal(code, assessment, baris, () => halamanDashboard(code)); } }, "📊 Analitik Soal"),
        el("button", { class: "btn", onclick: async (e) => {
          const btn2 = e.currentTarget; btn2.disabled = true; btn2.textContent = "Memuat…";
          const hasil = await panggilAPI("getAssessmentDetail", { code });
          btn2.disabled = false; btn2.textContent = "Edit Asesmen";
          if (!hasil.ok) { alert(hasil.error || "Gagal memuat asesmen."); return; }
          clearInterval(timer);
          halamanBuatAsesmen(hasil);
        }}, "Edit Asesmen"),
        ...tombolStatus,
        el("button", { class: "btn btn-red-outline", onclick: async () => {
          if (!confirm(`Hapus asesmen "${assessment.mapel}" (kode ${code}) beserta seluruh hasil pekerjaan siswanya? Tindakan ini tidak bisa dibatalkan.`)) return;
          const hasil = await panggilAPI("deleteAssessment", { code });
          if (!hasil.ok) { alert(hasil.error || "Gagal menghapus asesmen."); return; }
          clearInterval(timer);
          halamanGuruBeranda();
        }}, "Hapus Asesmen")
      )
    ));

    const tbl = el("table", {},
      el("thead", {}, el("tr", {}, ["Nama","Kelas","Status","Terjawab","Skor","Pindah Tab","Copy","Paste","Klik Kanan","Keluar Fullscreen"].map(h => el("th", {}, h))))
    );
    const tbody = el("tbody", {});
    baris.forEach(b => {
      tbody.appendChild(el("tr", {},
        el("td", { style: "font-weight:600;" }, b.nama),
        el("td", {}, b.kelas),
        el("td", {}, el("span", { class: "stamp", style: `color:${b.status === "Selesai" ? "var(--green)" : b.status === "Mengerjakan" ? "var(--gold)" : "var(--ink-soft)"}` }, b.status)),
        el("td", { class: "mono" }, `${b.terjawab||0}/${assessment.totalSoal}`),
        el("td", { class: "mono" }, b.status === "Selesai" ? `${b.skor}/${assessment.totalBobot}` : "—"),
        el("td", { class: "mono", style: b.pindahTab ? "color:var(--red)" : "" }, String(b.pindahTab||0)),
        el("td", { class: "mono", style: b.copy ? "color:var(--red)" : "" }, String(b.copy||0)),
        el("td", { class: "mono", style: b.paste ? "color:var(--red)" : "" }, String(b.paste||0)),
        el("td", { class: "mono", style: b.klikKanan ? "color:var(--red)" : "" }, String(b.klikKanan||0)),
        el("td", { class: "mono", style: b.keluarFullscreen ? "color:var(--red)" : "" }, String(b.keluarFullscreen||0))
      ));
    });
    tbl.appendChild(tbody);
    container.appendChild(el("div", { class: "card", style: "overflow:auto; padding:0;" }, tbl));

    container.appendChild(el("div", { class: "warn-box", style: "margin-top:16px;" },
      el("span", {}, "⚠"),
      el("p", { style: "margin:0;" }, "Kolom kecurangan mendeteksi pindah tab/aplikasi lain, copy, paste, klik kanan, dan keluar dari mode layar penuh (murid akan diminta kembali ke layar penuh sebelum bisa lanjut mengerjakan). Layar murid juga diberi watermark nama & kelasnya, jadi kalau ada tangkapan layar yang beredar, sumbernya bisa dikenali. Tangkapan layar itu sendiri tidak selalu bisa terdeteksi oleh browser, terutama di HP.")
    ));
  }

  muat();
  timer = setInterval(muat, 4000);
}

/* =========================================================
   7b) GURU — ANALITIK BUTIR SOAL
   Membantu guru mengidentifikasi soal yang paling banyak disalahkan
   (kemungkinan materi yang perlu diulang) dan siswa yang paling
   kesulitan (skor terendah) — dibaca HANYA saat halaman ini dibuka
   (opt-in), bukan bagian dari pemuatan dashboard biasa.
   ========================================================= */
function halamanAnalitikSoal(code, assessment, baris, kembali) {
  const container = el("div", { class: "wrap" });
  render(container);
  container.appendChild(el("p", { class: "muted" }, "Memuat analitik…"));

  panggilAPI("getAnalitikSoal", { code }).then((hasil) => {
    container.innerHTML = "";
    container.appendChild(el("div", { class: "row no-cetak", style: "margin-bottom:20px; justify-content:space-between; flex-wrap:wrap; gap:8px;" },
      el("button", { class: "btn", onclick: kembali }, "← Kembali ke Dashboard"),
      hasil.ok && hasil.totalSiswaSelesai > 0
        ? el("div", { class: "row", style: "gap:8px;" },
            el("button", { class: "btn", onclick: () => eksporAnalitikExcel_(assessment, hasil, baris) }, "📊 Ekspor Excel"),
            el("button", { class: "btn", onclick: () => window.print() }, "📄 Ekspor PDF")
          )
        : el("span")
    ));
    const areaCetak = el("div", { class: "area-cetak" });
    container.appendChild(areaCetak);

    if (!hasil.ok) {
      areaCetak.appendChild(el("p", {}, hasil.error || "Gagal memuat analitik."));
      return;
    }

    areaCetak.appendChild(el("h2", { class: "disp", style: "margin:0 0 4px;" }, `Analitik: ${assessment.mapel}`));
    areaCetak.appendChild(el("p", { class: "muted", style: "font-size:.85em; margin-bottom:20px;" },
      hasil.totalSiswaSelesai > 0
        ? `Berdasarkan ${hasil.totalSiswaSelesai} siswa yang sudah menyelesaikan asesmen ini.`
        : "Belum ada siswa yang menyelesaikan asesmen ini — analitik akan muncul begitu ada yang mengumpulkan jawaban."
    ));

    if (hasil.totalSiswaSelesai > 0) {
      const soalSulit = hasil.soal.filter((s) => s.persenBenar !== null && s.persenBenar < 50);
      if (soalSulit.length) {
        areaCetak.appendChild(el("div", { class: "warn-box", style: "margin-bottom:20px; background:var(--red-soft); border-color:var(--red);" },
          el("span", {}, "⚠"),
          el("p", { style: "margin:0;" },
            `${soalSulit.length} dari ${hasil.soal.length} soal punya tingkat kebenaran di bawah 50% — kemungkinan materinya perlu diulang atau soalnya perlu ditinjau ulang (mis. kurang jelas/terlalu sulit).`
          )
        ));
      }

      // --- Panel: butir soal, diurutkan dari yang paling banyak disalahkan ---
      areaCetak.appendChild(el("h3", { class: "disp", style: "font-size:1.05em; margin-bottom:10px;" }, "Tingkat Kebenaran per Soal"));
      const TIPE_LABEL = { pg: "Pilihan Ganda", pgk: "PG Kompleks", bs: "Benar-Salah", tbs: "Tabel Benar-Salah" };
      const daftarSoal = el("div", { style: "margin-bottom:24px;" });
      hasil.soal.forEach((s, urutan) => {
        const persen = s.persenBenar;
        const warna = persen === null ? "var(--ink-soft)" : persen < 40 ? "var(--red)" : persen < 70 ? "var(--gold)" : "var(--green)";
        const teksSingkat = String(s.teks || "").replace(/\n+/g, " ").slice(0, 110) + (String(s.teks || "").length > 110 ? "…" : "");
        daftarSoal.appendChild(el("div", { class: "card", style: "padding:14px 16px; margin-bottom:10px;" },
          el("div", { class: "between", style: "margin-bottom:8px; gap:10px;" },
            el("div", { style: "min-width:0;" },
              el("span", { class: "stamp", style: "color:var(--ink-soft); margin-right:6px;" }, TIPE_LABEL[s.tipe] || s.tipe),
              el("span", { class: "muted", style: "font-size:.72em;" }, `${s.bobot} poin`),
              el("p", { style: "margin:4px 0 0; font-size:.9em;" }, teksSingkat || "(soal tanpa teks)")
            ),
            el("div", { style: `text-align:right; flex-shrink:0;` },
              el("div", { class: "disp", style: `font-size:1.3em; color:${warna};` }, persen === null ? "—" : `${persen}%`),
              el("div", { class: "muted", style: "font-size:.7em;" }, "benar")
            )
          ),
          el("div", { style: "height:8px; background:var(--paper); border-radius:99px; overflow:hidden; margin-bottom:8px;" },
            el("div", { style: `height:100%; width:${persen ?? 0}%; background:${warna}; border-radius:99px;` })
          ),
          el("div", { class: "muted", style: "font-size:.72em;" },
            s.tipe === "tbs"
              ? `${s.benar} benar semua · ${s.sebagian} sebagian benar · ${s.salah} salah semua (dari ${s.dijawab} siswa)`
              : `${s.benar} benar · ${s.salah} salah (dari ${s.dijawab} siswa)`
          )
        ));
      });
      areaCetak.appendChild(daftarSoal);

      // --- Panel: siswa dengan skor terendah (dari data yang sudah ada, tidak perlu fetch lagi) ---
      const selesai = (baris || []).filter((b) => b.status === "Selesai");
      if (selesai.length) {
        const terendah = selesai.slice().sort((a2, b2) => a2.skor - b2.skor).slice(0, 5);
        areaCetak.appendChild(el("h3", { class: "disp", style: "font-size:1.05em; margin-bottom:10px;" }, "Siswa dengan Skor Terendah"));
        const tbl2 = el("table", {},
          el("tr", {}, el("th", {}, "Nama"), el("th", {}, "Kelas"), el("th", { style: "text-align:right;" }, "Skor"))
        );
        terendah.forEach((b) => {
          tbl2.appendChild(el("tr", {},
            el("td", { style: "font-weight:600;" }, b.nama),
            el("td", {}, b.kelas),
            el("td", { class: "mono", style: "text-align:right;" }, `${b.skor}/${assessment.totalBobot}`)
          ));
        });
        areaCetak.appendChild(el("div", { class: "card", style: "overflow:auto; padding:0;" }, tbl2));
      }
    }
  });
}

/** Ekspor .xlsx dari data analitik yang sudah dimuat (client-side, tanpa
 * perlu panggilan server tambahan) — dua sheet: rincian per soal, dan
 * daftar LENGKAP semua siswa (bukan cuma 5 terendah, supaya guru punya
 * arsip nilai penuh kalau perlu). Memakai library XLSX yang sudah dimuat
 * di halaman ini (dipakai juga oleh fitur impor daftar siswa). */
function eksporAnalitikExcel_(assessment, hasilAnalitik, baris) {
  if (typeof XLSX === "undefined") {
    alert("Gagal memuat komponen Excel — periksa koneksi internetmu, lalu coba lagi.");
    return;
  }
  const TIPE_LABEL = { pg: "Pilihan Ganda", pgk: "PG Kompleks", bs: "Benar-Salah", tbs: "Tabel Benar-Salah" };

  const dataSoal = [["No", "Tipe Soal", "Bobot", "Persen Benar", "Benar Semua", "Sebagian Benar", "Salah Semua", "Jumlah Dijawab", "Teks Soal"]];
  hasilAnalitik.soal.forEach((s, i) => {
    dataSoal.push([
      i + 1, TIPE_LABEL[s.tipe] || s.tipe, s.bobot,
      s.persenBenar === null ? "-" : `${s.persenBenar}%`,
      s.benar, s.sebagian, s.salah, s.dijawab,
      String(s.teks || "").replace(/\n+/g, " "),
    ]);
  });

  const dataSiswa = [["Nama", "Kelas", "Status", "Skor", "Total Bobot"]];
  (baris || []).slice()
    .sort((a, b) => (a.status === "Selesai" ? a.skor : Infinity) - (b.status === "Selesai" ? b.skor : Infinity))
    .forEach((b) => {
      dataSiswa.push([b.nama, b.kelas, b.status, b.status === "Selesai" ? b.skor : "-", assessment.totalBobot]);
    });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dataSoal), "Analitik Soal");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dataSiswa), "Semua Siswa");
  const namaFile = `Analitik - ${assessment.mapel} - ${new Date().toISOString().slice(0, 10)}.xlsx`.replace(/[\\/:*?"<>|]/g, "-");
  XLSX.writeFile(wb, namaFile);
}

/* =========================================================
   9) MURID — MENGERJAKAN (dengan deteksi kecurangan)
   ========================================================= */
function halamanMuridKerjakan(assessment, siswaId) {
  const siswa = assessment.siswa.find(s => s.id === siswaId);
  let state = null;   // { urutanSoal, urutanOpsi, jawaban, mulai }
  let sisaMs = null;
  let sudahSubmit = false;
  let timerInterval = null;
  let lastCheat = {};

  /* =========================================================
     PENYIMPANAN JAWABAN — status per soal + coba ulang otomatis
     ---------------------------------------------------------
     Sebelumnya panggilAPI("saveAnswer", …) dipanggil tanpa ditunggu
     (fire-and-forget): kalau koneksi terputus sesaat, jawaban yang
     TERLIHAT sudah dipilih di layar murid TIDAK benar-benar tersimpan
     di server — dan murid sama sekali tidak diberi tahu.

     Sekarang setiap jawaban punya status: "menyimpan" → "tersimpan"
     atau "gagal" (setelah 3x percobaan dengan jeda makin lama). Status
     ini ditampilkan di soal yang sedang dibuka & di palet nomor soal,
     dan "Kumpulkan Jawaban" akan menolak submit otomatis kalau masih
     ada status "menyimpan"/"gagal" yang belum beres.
     ========================================================= */
  const statusSimpan = {};   // soalId -> "menyimpan" | "tersimpan" | "gagal"
  const versiSimpan = {};    // soalId -> nomor percobaan terbaru (cegah balapan)

  function tunggu_(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

  async function simpanJawabanKeServer(soalId, pilihan) {
    const versi = (versiSimpan[soalId] = (versiSimpan[soalId] || 0) + 1);
    statusSimpan[soalId] = "menyimpan";
    gambarSoal();
    const JEDA_MS = [1200, 2500, 4500]; // 3 kali percobaan dengan jeda makin lama
    for (let percobaan = 0; percobaan <= JEDA_MS.length; percobaan++) {
      try {
        const hasil = await panggilAPI("saveAnswer", { code: assessment.code, siswaId, soalId, pilihan });
        if (!hasil || !hasil.ok) throw new Error((hasil && hasil.error) || "Server menolak jawaban.");
        if (versiSimpan[soalId] === versi) { statusSimpan[soalId] = "tersimpan"; gambarSoal(); }
        return;
      } catch (err) {
        if (percobaan < JEDA_MS.length) { await tunggu_(JEDA_MS[percobaan]); continue; }
        if (versiSimpan[soalId] === versi) { statusSimpan[soalId] = "gagal"; gambarSoal(); }
      }
    }
  }

  window.addEventListener("beforeunload", (e) => {
    if (sudahSubmit) return;
    const adaYangBelumAman = Object.values(statusSimpan).some((s) => s === "menyimpan" || s === "gagal");
    if (adaYangBelumAman) { e.preventDefault(); e.returnValue = ""; }
  });

  const rootNode = el("div", {});
  render(rootNode, { noHeader: true }); // sedang ujian (mode fullscreen) — pakai .examhead sendiri, bukan header portal

  function catatKecurangan(tipe) {
    const now = Date.now();
    if (lastCheat[tipe] && now - lastCheat[tipe] < 800) return;
    lastCheat[tipe] = now;
    panggilAPI("logCheat", { code: assessment.code, siswaId, tipe });
  }

  document.addEventListener("visibilitychange", () => { if (document.hidden && !sudahSubmit) catatKecurangan("tab"); });
  document.addEventListener("copy", () => !sudahSubmit && catatKecurangan("copy"));
  document.addEventListener("paste", () => !sudahSubmit && catatKecurangan("paste"));
  document.addEventListener("contextmenu", (e) => { if (!sudahSubmit) { e.preventDefault(); catatKecurangan("klikKanan"); } });

  /* --- Watermark nama murid (tampak di layar & di tangkapan layar) --- */
  let watermarkEl = null;
  function pasangWatermark() {
    if (watermarkEl || !siswa) return;
    const teks = siswa.kelas ? `${siswa.nama} · ${siswa.kelas}` : siswa.nama;
    watermarkEl = el("div", {
      style: `position:fixed; inset:0; z-index:40; pointer-events:none; background-image:url('${buatWatermarkDataUrl(teks)}'); background-repeat:repeat;`,
    });
    document.body.appendChild(watermarkEl);
  }
  function lepasWatermark() {
    if (watermarkEl) { watermarkEl.remove(); watermarkEl = null; }
  }

  /* --- Overlay: paksa kembali ke layar penuh sebelum lanjut --- */
  const overlayFullscreen = el("div", {
    style: "position:fixed; inset:0; z-index:9999; background:rgba(27,42,74,0.95); display:none; align-items:center; justify-content:center; padding:24px; text-align:center;",
  });
  document.body.appendChild(overlayFullscreen);

  function tampilkanOverlayFullscreen() {
    overlayFullscreen.innerHTML = "";
    overlayFullscreen.style.display = "flex";
    overlayFullscreen.appendChild(el("div", { style: "max-width:380px;" },
      el("div", { style: "font-size:2.4em; margin-bottom:12px;" }, "⛶"),
      el("h2", { class: "disp", style: "color:white; margin:0 0 8px;" }, "Kembali ke Layar Penuh"),
      el("p", { style: "color:rgba(255,255,255,.78); font-size:.9em; margin-bottom:22px;" },
        "Kamu keluar dari mode layar penuh. Kejadian ini sudah tercatat untuk gurumu. Klik tombol di bawah untuk melanjutkan mengerjakan."),
      el("button", { class: "btn btn-red", onclick: () => masukLayarPenuh() }, "Lanjutkan Mengerjakan")
    ));
  }
  function sembunyikanOverlayFullscreen() {
    overlayFullscreen.style.display = "none";
  }

  function onFullscreenChange() {
    const sedangFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
    if (sudahSubmit) return;
    if (sedangFull) {
      sembunyikanOverlayFullscreen();
    } else {
      catatKecurangan("keluarFullscreen");
      tampilkanOverlayFullscreen();
    }
  }
  document.addEventListener("fullscreenchange", onFullscreenChange);
  document.addEventListener("webkitfullscreenchange", onFullscreenChange);

  async function mulai() {
    let hasil;
    try {
      hasil = await panggilAPI("startOrResume", { code: assessment.code, siswaId });
    } catch (err) {
      rootNode.appendChild(el("div", { class: "center" },
        el("div", { class: "card", style: "max-width:380px; text-align:center;" },
          el("p", {}, "Gagal terhubung ke server. Periksa koneksi internetmu, lalu coba lagi."),
          el("button", { class: "btn btn-red", onclick: () => { rootNode.innerHTML = ""; mulai(); } }, "Coba Lagi")
        )
      ));
      return;
    }
    if (!hasil.ok) {
      rootNode.appendChild(el("div", { class: "center" }, el("p", {}, hasil.error)));
      return;
    }
    if (hasil.sudahSelesai) {
      tampilkanSelesai();
      return;
    }
    state = { urutanSoal: hasil.urutanSoal, urutanOpsi: hasil.urutanOpsi, jawaban: hasil.jawaban || {}, mulai: hasil.mulai };
    pasangWatermark();
    gambarSoal();
    timerInterval = setInterval(hitungWaktu, 1000);
    hitungWaktu();
  }

  function hitungWaktu() {
    const batas = assessment.waktuMenit * 60000;
    sisaMs = batas - (Date.now() - state.mulai);
    const el2 = document.getElementById("ak-timer");
    if (el2) {
      el2.textContent = fmtWaktu(sisaMs);
      el2.style.background = sisaMs <= 15000 ? "var(--red)" : "var(--blue)";
    }
    if (sisaMs <= 0 && !sudahSubmit) { kumpulkan(true); }
  }

  async function pilihJawabanTunggal(soalId, idxAsli) {
    state.jawaban[soalId] = idxAsli;
    gambarSoal();
    simpanJawabanKeServer(soalId, idxAsli);
  }

  async function pilihJawabanKompleks(soalId, idxAsli) {
    const sudahAda = Array.isArray(state.jawaban[soalId]) ? state.jawaban[soalId] : [];
    const ada = sudahAda.includes(idxAsli);
    const baru = ada ? sudahAda.filter((v) => v !== idxAsli) : [...sudahAda, idxAsli];
    state.jawaban[soalId] = baru;
    gambarSoal();
    simpanJawabanKeServer(soalId, baru);
  }

  // Tipe "tbs" (Tabel Benar-Salah): jawaban berupa array boolean/null sepanjang
  // jumlah pernyataan — satu entri per baris pernyataan, independen satu sama lain.
  async function pilihJawabanMatriks(soalId, jumlahPernyataan, idxPernyataan, nilai) {
    const sudahAda = Array.isArray(state.jawaban[soalId]) ? state.jawaban[soalId].slice() : new Array(jumlahPernyataan).fill(null);
    sudahAda[idxPernyataan] = nilai;
    state.jawaban[soalId] = sudahAda;
    gambarSoal();
    simpanJawabanKeServer(soalId, sudahAda);
  }

  async function kumpulkan(otomatis) {
    if (sudahSubmit) return;

    // Kalau guru mengaktifkan "wajib jawab semua soal", cegah pengumpulan
    // MANUAL selagi masih ada yang kosong — dicek di sini dulu (lebih cepat,
    // langsung kasih tahu berapa yang kurang) SEBELUM ke server; server
    // (finish_) tetap memvalidasi ulang sebagai jaring pengaman kedua.
    // Pengumpulan OTOMATIS (waktu habis) selalu diloloskan tanpa syarat ini.
    if (assessment.wajibLengkap && !otomatis) {
      const totalSoal = state.urutanSoal.length;
      const terjawab = state.urutanSoal.filter(soalTerjawab_).length;
      if (terjawab < totalSoal) {
        alert(`Masih ada ${totalSoal - terjawab} dari ${totalSoal} soal yang belum dijawab.\n\nJawab semua soal dulu sebelum bisa mengumpulkan.`);
        return;
      }
    }

    const belumAman = Object.keys(statusSimpan).filter((id) => statusSimpan[id] === "menyimpan" || statusSimpan[id] === "gagal");
    if (!otomatis && belumAman.length) {
      const mauCoba = confirm(
        `Masih ada ${belumAman.length} jawaban yang belum berhasil tersimpan ke server (kemungkinan koneksi internetmu sedang bermasalah).\n\n` +
        `Klik OK untuk mencoba menyimpannya lagi sekarang, atau Batal untuk memeriksa koneksimu dulu sebelum mengumpulkan.`
      );
      if (mauCoba) belumAman.forEach((id) => simpanJawabanKeServer(id, state.jawaban[id]));
      return;
    }

    if (!otomatis && !confirm("Kumpulkan jawaban sekarang? Kamu tidak bisa mengubahnya lagi setelah ini.")) return;

    sudahSubmit = true;
    clearInterval(timerInterval);
    keluarLayarPenuh();
    try {
      const hasil = await panggilAPI("finish", { code: assessment.code, siswaId, paksa: otomatis });
      if (!hasil || !hasil.ok) throw new Error((hasil && hasil.error) || "Server menolak permintaan kumpulkan jawaban.");
      tampilkanSelesai();
    } catch (err) {
      sudahSubmit = false; // izinkan murid mencoba kumpulkan lagi
      alert("Gagal mengumpulkan jawaban — periksa koneksi internetmu, lalu tekan tombol \"Kumpulkan Jawaban\" sekali lagi.\n\n(" + (err && err.message ? err.message : err) + ")");
      gambarSoal();
    }
  }

  function tampilkanSelesai() {
    // Skor SENGAJA tidak ditampilkan di layar ini — murid tidak diberi tahu
    // nilainya sendiri lewat halaman ini. Skor hanya bisa dilihat guru lewat
    // dashboard hasil, atau diumumkan lewat cara lain sesuai kebijakan guru.
    lepasWatermark();
    sembunyikanOverlayFullscreen();
    overlayFullscreen.remove();
    rootNode.innerHTML = "";
    rootNode.appendChild(el("div", { class: "center" },
      el("div", { class: "card", style: "max-width:420px; text-align:center;" },
        el("div", { style: "font-size:2em; color:var(--green);" }, "✓"),
        el("h2", { class: "disp" }, "Jawaban Terkumpul"),
        el("p", { class: "muted", style: "font-size:.9em; margin-bottom:8px;" }, `Terima kasih, ${siswa.nama}. Jawabanmu untuk ${assessment.mapel} sudah tersimpan.`),
        el("p", { class: "muted", style: "font-size:.8em; margin-bottom:20px;" }, "Hasil/skor akan disampaikan oleh gurumu, bukan ditampilkan di halaman ini."),
        el("button", { class: "btn", onclick: halamanBeranda }, "Selesai")
      )
    ));
  }

  let soalAktif = 0; // indeks di dalam state.urutanSoal — layar murid: satu soal per halaman (gaya CBT)
  let drawerTerbuka = false;

  function soalTerjawab_(soalId) {
    const s = soalById(soalId);
    const j = state.jawaban[soalId];
    if (!s) return false;
    if (s.tipe === "pgk") return Array.isArray(j) && j.length > 0;
    if (s.tipe === "tbs") {
      const n = (s.pernyataan || []).length;
      return n > 0 && Array.isArray(j) && j.length === n && j.every((v) => v === true || v === false);
    }
    return j !== undefined && j !== null;
  }
  function soalById(id) {
    return Object.fromEntries(assessment.soal.map(s => [s.id, s]))[id];
  }

  function gambarSoal() {
    rootNode.innerHTML = "";
    rootNode.style.userSelect = "none";
    rootNode.style.paddingBottom = "80px";

    rootNode.appendChild(el("div", { class: "examhead" },
      el("div", { class: "examhead-top" },
        elTombolTogglSoal(() => { drawerTerbuka = !drawerTerbuka; gambarSoal(); }),
        el("img", { src: LOGO_SEKOLAH_B64, alt: "Logo Sekolah", class: "examhead-logo" }),
        el("div", { class: "examhead-text" },
          el("div", { class: "eyebrow" }, "Asesmen Sumatif"),
          el("div", { class: "mapel" }, assessment.mapel || "—"),
          el("div", { class: "siswa" }, `${siswa.nama} — ${siswa.kelas}`)
        )
      ),
      el("div", { class: "timer-chip", id: "ak-timer" }, fmtWaktu(sisaMs ?? assessment.waktuMenit * 60000))
    ));

    const inner = el("div", { class: "wrap", style: "max-width:680px;" });
    inner.appendChild(elBannerKatex());
    const totalSoal = state.urutanSoal.length;
    const terjawab = state.urutanSoal.filter(soalTerjawab_).length;

    inner.appendChild(el("div", { class: "between muted", style: "font-size:.8em; margin-bottom:10px;" },
      el("span", {}, `${terjawab} dari ${totalSoal} terjawab`),
      el("span", {}, `Soal ${soalAktif + 1} dari ${totalSoal}${(() => { const s0 = soalById(state.urutanSoal[soalAktif]); return s0 ? ` · ${Number(s0.bobot) || 1} poin` : ""; })()}`)
    ));

    const soalId = state.urutanSoal[soalAktif];
    const s = soalById(soalId);
    if (s) {
      const kompleks = s.tipe === "pgk";
      const matriks = s.tipe === "tbs";
      const urutanOpsi = matriks ? [] : (state.urutanOpsi[soalId] || s.opsi.map((_, i) => i));
      const dipilih = state.jawaban[soalId];
      const dipilihArr = kompleks ? (Array.isArray(dipilih) ? dipilih : []) : null;
      const jumlahPernyataan = matriks ? (s.pernyataan || []).length : 0;
      const dipilihMatriks = matriks ? (Array.isArray(dipilih) ? dipilih : new Array(jumlahPernyataan).fill(null)) : null;
      const status = statusSimpan[soalId];
      const badgeStatus =
        status === "menyimpan" ? el("span", { class: "status-simpan menyimpan" }, "⏳ Menyimpan…") :
        status === "gagal" ? el("span", {
          class: "status-simpan gagal",
          onclick: () => simpanJawabanKeServer(soalId, state.jawaban[soalId]),
        }, "⚠️ Gagal tersimpan — klik untuk coba lagi") :
        status === "tersimpan" ? el("span", { class: "status-simpan tersimpan" }, "✓ Tersimpan") :
        el("span");
      const qcard = el("div", { class: "qcard" },
        el("div", { class: "row", style: "align-items:flex-start; margin-bottom:4px;" },
          el("span", { class: "mono muted", style: "font-weight:600;" }, `${soalAktif+1}.`),
          el("p", { style: "margin:0; font-weight:500; flex:1; min-width:0;", html: formatTeksKeHtml(s.teks) })
        ),
        elGambarDenganCadangan("gambar-soal", s, "margin-left:22px; max-width:calc(100% - 22px);"),
        kompleks ? el("p", { class: "muted", style: "font-size:.75em; margin:0 0 6px 22px;" }, "Pilih satu atau lebih jawaban yang benar.") :
          matriks ? el("p", { class: "muted", style: "font-size:.75em; margin:0 0 6px 22px;" }, "Tentukan BENAR atau SALAH untuk setiap pernyataan di bawah ini.") : el("span"),
        el("div", { style: "margin:0 0 10px 22px;" }, badgeStatus)
      );
      if (matriks) {
        const tabelWrap = el("div", { style: "overflow-x:auto; margin-left:22px;" });
        const tabel = el("table", {},
          el("tr", {},
            el("th", {}, "Pernyataan"),
            el("th", { style: "text-align:center; width:64px;" }, "BENAR"),
            el("th", { style: "text-align:center; width:64px;" }, "SALAH")
          )
        );
        (s.pernyataan || []).forEach((p, idx) => {
          const nilai = dipilihMatriks[idx];
          const radio = (aktif) => el("span", {
            class: `radio ${aktif ? "pilih" : ""}`, style: "margin:0 auto; cursor:pointer;",
          });
          const selBenar = radio(nilai === true);
          const selSalah = radio(nilai === false);
          const tdBenar = el("td", { style: "text-align:center; cursor:pointer;", onclick: () => pilihJawabanMatriks(soalId, jumlahPernyataan, idx, true) }, selBenar);
          const tdSalah = el("td", { style: "text-align:center; cursor:pointer;", onclick: () => pilihJawabanMatriks(soalId, jumlahPernyataan, idx, false) }, selSalah);
          tabel.appendChild(el("tr", {},
            el("td", { style: "white-space:normal; text-align:left;" }, el("span", { html: `${HURUF[idx]}. ${formatTeksKeHtml(p.teks)}` })),
            tdBenar, tdSalah
          ));
        });
        tabelWrap.appendChild(tabel);
        qcard.appendChild(tabelWrap);
      } else {
        const opsiGrid = el("div", { style: "display:grid; gap:2px;" });
        urutanOpsi.forEach((idxAsli, posisi) => {
          const terpilih = kompleks ? dipilihArr.includes(idxAsli) : dipilih === idxAsli;
          const opsiObj = normalisasiOpsiFE(s.opsi[idxAsli]);
          const label = el("label", { class: `opsi ${terpilih ? "pilih" : ""}`, style: "align-items:flex-start;" },
            el("span", { class: "opsi-letter" }, `${HURUF[posisi]}.`),
            el("span", { class: `radio ${kompleks ? "kotak" : ""} ${terpilih ? "pilih" : ""}` }),
            el("div", { style: "flex:1; min-width:0;" },
              opsiObj.teks ? el("span", { class: "opsi-teks", html: formatTeksKeHtml(opsiObj.teks) }) : el("span"),
              elGambarDenganCadangan("gambar-opsi", opsiObj)
            )
          );
          label.addEventListener("click", () => kompleks ? pilihJawabanKompleks(soalId, idxAsli) : pilihJawabanTunggal(soalId, idxAsli));
          opsiGrid.appendChild(label);
        });
        qcard.appendChild(opsiGrid);
      }
      inner.appendChild(qcard);
      renderMatematika(qcard);
    }

    inner.appendChild(el("div", { class: "navseg", style: "margin-bottom:14px;" },
      el("button", { disabled: soalAktif === 0 ? "true" : null, onclick: () => { soalAktif--; gambarSoal(); } },
        el("span", {}, "←"), el("span", {}, "Sebelumnya")),
      el("button", { disabled: soalAktif === totalSoal - 1 ? "true" : null, onclick: () => { soalAktif++; gambarSoal(); } },
        el("span", {}, "Berikutnya"), el("span", {}, "→"))
    ));
    inner.appendChild(el("button", { class: "btn btn-red btn-block", onclick: () => kumpulkan(false) }, "Kumpulkan Jawaban"));
    if (assessment.wajibLengkap) {
      const totalSoal2 = state.urutanSoal.length;
      const terjawab2 = state.urutanSoal.filter(soalTerjawab_).length;
      inner.appendChild(el("p", { class: "muted", style: "font-size:.75em; text-align:center; margin-top:8px;" },
        terjawab2 < totalSoal2
          ? `⚠ Semua soal wajib dijawab dulu (${terjawab2}/${totalSoal2} terjawab) sebelum bisa mengumpulkan.`
          : "✓ Semua soal sudah terjawab, siap dikumpulkan."
      ));
    }

    rootNode.appendChild(inner);

    const { overlay, drawer } = elDrawerNomorSoal({
      jumlah: totalSoal,
      terjawabFn: (i) => soalTerjawab_(state.urutanSoal[i]),
      statusFn: (i) => statusSimpan[state.urutanSoal[i]],
      aktifIndex: soalAktif,
      onPilih: (i) => { soalAktif = i; drawerTerbuka = false; gambarSoal(); },
      terbuka: drawerTerbuka,
      onTutup: () => { drawerTerbuka = false; gambarSoal(); },
      tombolBawah: el("button", { class: "btn btn-red btn-block", onclick: () => kumpulkan(false) }, "✅ Kirim Jawaban"),
    });
    rootNode.appendChild(overlay);
    rootNode.appendChild(drawer);
  }

  mulai();
}

/* =========================================================
   10) MULAI
   ========================================================= */
if (cekKonfigurasi()) halamanBeranda();
</script>
