const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxN-rzl2M3ksKRjvbZ68_UvVLe3hrhpcvge8dbQYsIjgtGCxiKhP5Gu4YOBNVsKN51c/exec";

/* =========================================================
   1b) SANDI GURU
   Sandi guru TIDAK PERNAH ditulis di file ini sebagai teks — kalau ditulis
   di sini, siapa pun bisa membacanya lewat "Lihat Sumber Halaman" (View Page
   Source), bahkan tanpa membuka menu guru sama sekali. Sebagai gantinya:
   guru mengetik sandinya di layar "Khusus Guru/Admin" (lihat
   halamanGuruGerbang di bawah), sandi itu dikirim ke server untuk diperiksa
   lewat aksi "cekSandi", dan HANYA kalau server bilang cocok, sandinya
   disimpan sementara di variabel memori berikut — hilang lagi begitu
   halaman ditutup/dimuat ulang. Sandi asli tetap hanya hidup di code.gs.
   ========================================================= */
let sandiGuruTersimpan = "";
const AKSI_GURU_FE = ["cekSandi", "createAssessment", "listAssessments", "getResults", "setStatus", "uploadGambar", "getAssessmentDetail", "updateAssessment", "deleteAssessment", "backupSekarang", "aktifkanCadanganOtomatis", "matikanCadanganOtomatis", "statusCadanganOtomatis", "getAnalitikSoal"];

/* =========================================================
   2) STYLE (motif kertas ujian / LJK sekolah)
   ========================================================= */
const style = document.createElement("style");
style.textContent = `
  /* =========================================================
     DESAIN VISUAL — SMP NEGERI 1 DLINGO (palet biru langit modern)
     Nama variabel & class LAMA (--paper, --ink, --blue, .card, .btn, dst.)
     sengaja DIPERTAHANKAN persis supaya seluruh logika JS di bawah (yang
     sudah teruji: editor soal, anti-kecurangan, cadangan, dsb.) tidak perlu
     disentuh sama sekali — yang berubah murni NILAI warna/radius/shadow-nya.
     ========================================================= */
  :root{
    --paper:#F8FAFC; --paper-line:#CBD5E1; --ink:#0F172A; --ink-soft:#64748B;
    --red:#EF4444; --red-soft:#FEF2F2; --gold:#EAB308; --gold-soft:#FEFCE8;
    --green:#10B981; --green-soft:#ECFDF5; --card:#FFFFFF;
    --navy2:#075985; --blue:#0284C7; --blue-soft:#F0F9FF; --blue-hover:#0369A1;
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.05); --shadow-md:0 4px 14px rgba(15,23,42,.08);
    --shadow-lg:0 12px 28px rgba(15,23,42,.12);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;
    color:var(--ink); background:var(--paper); min-height:100vh; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .disp{ font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif; font-weight:800; letter-spacing:-.01em; }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; }
  .wrap{ max-width:760px; margin:0 auto; padding:0 18px 90px; }
  .center{ min-height:calc(100vh - 132px); display:flex; align-items:center; justify-content:center; padding:24px 16px 60px; }
  .card{ background:var(--card); border:1px solid var(--paper-line); border-radius:var(--radius-xl);
    box-shadow:var(--shadow-md); padding:28px; }
  .btn{ font-family:inherit; font-weight:600; border-radius:var(--radius-md); padding:.75em 1.3em; font-size:.925em;
    border:1px solid var(--paper-line); cursor:pointer; background:var(--card); color:var(--ink); transition:all .15s ease; }
  .btn:hover:not(:disabled){ border-color:var(--border-hover,#94A3B8); box-shadow:var(--shadow-sm); transform:translateY(-1px); }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .btn-primary:hover:not(:disabled){ background:var(--blue-hover); border-color:var(--blue-hover); }
  .btn-red{ background:var(--blue); color:#fff; border-color:var(--blue); font-weight:700; }
  .btn-red:hover:not(:disabled){ background:var(--blue-hover); border-color:var(--blue-hover); }
  .btn-red-outline{ background:transparent; color:var(--red); border-color:var(--red); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-block{ width:100%; justify-content:center; }
  input,select,textarea{
    width:100%; border:1px solid var(--paper-line); background:white; border-radius:var(--radius-md);
    padding:.7em .85em; font-family:inherit; color:var(--ink); outline:none; font-size:.95em;
  }
  input:focus,select:focus,textarea:focus{ border-color:var(--blue); box-shadow:0 0 0 4px rgba(2,132,199,.15); }
  label.field{ display:block; font-size:.85em; font-weight:600; margin-bottom:.35em; color:var(--ink-soft); }
  .stamp{ display:inline-flex; align-items:center; gap:.35em; font-size:.72em; font-weight:700;
    letter-spacing:.04em; text-transform:uppercase; padding:.3em .8em; border-radius:99px; border:1.5px solid currentColor; }

  /* =========================================================
     HEADER PORTAL (baru) — logo + nama sekolah + tombol kontekstual,
     tampil konsisten di semua halaman KECUALI saat murid sedang
     mengerjakan ujian (punya .examhead sendiri yang lebih ringkas).
     ========================================================= */
  .header-wrap{ max-width:760px; margin:0 auto; padding:18px 18px 0; }
  .app-header{ display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--card); padding:14px 22px; border-radius:var(--radius-lg); border:1px solid var(--paper-line);
    box-shadow:var(--shadow-sm); margin-bottom:22px; }
  .brand-group{ display:flex; align-items:center; gap:14px; min-width:0; }
  .school-logo-img{ height:50px; width:auto; max-width:58px; object-fit:contain; flex-shrink:0;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.12)); }
  .brand-text{ min-width:0; }
  .brand-text h1{ font-family:'Plus Jakarta Sans',sans-serif; font-size:1.05em; font-weight:800; color:var(--ink);
    line-height:1.2; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand-text p{ font-size:.76em; color:var(--ink-soft); font-weight:600; margin-top:2px; }
  @media(max-width:560px){ .brand-text p{ display:none; } .school-logo-img{ height:40px; } .app-header{ padding:10px 14px; } }
  .chip-hapus{ border:none; background:transparent; cursor:pointer; padding:0; margin-left:1px;
    font-size:1.15em; line-height:1; color:inherit; font-family:inherit; opacity:.6; }
  .chip-hapus:hover{ opacity:1; color:var(--red); }
  .opsi{ display:flex; align-items:center; gap:14px; padding:14px 10px; border-radius:var(--radius-md); cursor:pointer; background:transparent; }
  .opsi:hover{ background:var(--blue-soft); }
  .opsi.pilih{ background:var(--blue-soft); }
  .opsi-letter{ font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:1.05em; width:1.2em; flex-shrink:0; color:var(--ink); }
  .radio{ width:24px; height:24px; border-radius:50%; border:2px solid var(--paper-line); flex-shrink:0; background:#fff; position:relative; }
  .radio.kotak{ border-radius:7px; }
  .radio.pilih{ border-color:var(--blue); }
  .radio.pilih::after{ content:""; position:absolute; inset:5px; border-radius:50%; background:var(--blue); }
  .radio.kotak.pilih::after{ border-radius:2px; inset:4px; }
  .opsi-teks{ font-size:.98em; line-height:1.4; display:block; max-width:100%; overflow-x:auto; }
  .bulat{ width:2.1em; height:2.1em; border-radius:50%; border:2px solid var(--paper-line); display:flex;
    align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-weight:700;
    flex-shrink:0; background:white; color:var(--ink-soft); }
  .bulat.pilih{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .bulat.kotak{ border-radius:8px; }
  table{ border-collapse:collapse; width:100%; font-size:.85em; }
  th{ font-family:'IBM Plex Mono',monospace; font-size:.68em; letter-spacing:.05em; text-transform:uppercase;
    text-align:left; color:var(--ink-soft); border-bottom:2px solid var(--paper-line); padding:.7em .7em; background:var(--paper); white-space:nowrap; }
  td{ border-bottom:1px solid var(--paper-line); padding:.7em .7em; white-space:nowrap; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:1em; }
  @media(max-width:560px){ .grid2{ grid-template-columns:1fr; } }
  .row{ display:flex; gap:.6em; align-items:center; flex-wrap:wrap; }
  .between{ display:flex; align-items:center; justify-content:space-between; gap:.8em; flex-wrap:wrap; }
  .muted{ color:var(--ink-soft); }
  .qcard{ background:var(--card); border:1px solid var(--paper-line); border-radius:var(--radius-lg); padding:22px; margin-bottom:16px;
    box-shadow:var(--shadow-sm); overflow-x:hidden; }
  .qcard p{ overflow-x:auto; max-width:100%; }
  /* Rumus KaTeX panjang (pecahan bertingkat, matriks, dll) digulir horizontal
     alih-alih memotong tampilan atau mendorong layar melebar — penting untuk
     layar sempit HP karena murid mengerjakan dari ponsel masing-masing. */
  .katex-display{ overflow-x:auto; overflow-y:hidden; padding:4px 0; margin:4px 0; }
  .katex{ max-width:100%; }
  .sticky{ position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1.5px solid var(--paper-line);
    padding:14px 18px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.6em; }
  .examhead{ position:sticky; top:0; z-index:5; background:linear-gradient(155deg,var(--blue-hover),var(--navy2));
    color:#fff; border-radius:0 0 24px 24px; padding:20px 22px 26px; position:relative; }
  .examhead-top{ display:flex; align-items:flex-start; gap:12px; padding-right:88px; }
  .examhead-logo{ width:40px; height:40px; object-fit:contain; flex-shrink:0;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
  .examhead-text{ min-width:0; flex:1; }
  .examhead .eyebrow{ font-size:.72em; letter-spacing:.14em; text-transform:uppercase; font-weight:600;
    color:rgba(255,255,255,.62); margin-bottom:2px; }
  .examhead .mapel{ font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:1.15em; margin-bottom:8px; }
  .examhead .siswa{ font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:1.4em; line-height:1.25;
    text-transform:uppercase; letter-spacing:.01em; max-width:70%; }
  .timer-chip{ position:absolute; top:20px; right:20px; background:var(--red); color:#fff;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:1.15em; padding:.5em 1em;
    border-radius:99px; box-shadow:0 10px 22px -8px rgba(239,68,68,.55); }
  .navseg{ display:flex; border:1px solid var(--paper-line); border-radius:var(--radius-lg); overflow:hidden; background:var(--card); }
  .navseg button{ flex:1; border:none; background:transparent; padding:.85em .6em; font-family:inherit;
    font-weight:600; color:var(--ink); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.9em; }
  .navseg button:first-child{ border-right:1px solid var(--paper-line); }
  .navseg button:disabled{ opacity:.35; cursor:not-allowed; }
  .navseg button:not(:disabled):hover{ background:var(--paper); }
  .palet-btn{ width:2.4em; height:2.4em; border-radius:var(--radius-sm); border:1px solid var(--paper-line); background:var(--card);
    font-family:'IBM Plex Mono',monospace; font-weight:700; cursor:pointer; color:var(--ink-soft); }
  .palet-btn.aktif{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .palet-btn.terjawab{ background:var(--blue-soft); border-color:#BAE6FD; color:var(--blue); }
  .palet-btn.gagal{ background:var(--red-soft); border-color:var(--red); color:var(--red); }
  .palet-btn.menyimpan{ background:var(--gold-soft); border-color:var(--gold); color:#7A5B00; }

  /* Drawer navigasi nomor soal (menggantikan palet yang dulu selalu terlihat) */
  .btn-soal-toggle{ background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:10px;
    padding:.5em .8em; font-family:inherit; font-weight:600; font-size:.82em; display:inline-flex;
    align-items:center; gap:6px; cursor:pointer; flex-shrink:0; white-space:nowrap; }
  .btn-soal-toggle:active{ transform:translateY(1px); }
  .drawer-overlay{ position:fixed; inset:0; background:rgba(15,17,25,.55); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .22s ease; }
  .drawer-overlay.terbuka{ opacity:1; pointer-events:auto; }
  .drawer-soal{ position:fixed; top:0; left:0; height:100%; width:min(320px,85vw); background:#15171F;
    color:#fff; z-index:41; transform:translateX(-100%); transition:transform .25s ease;
    padding:20px 18px; overflow-y:auto; box-shadow:8px 0 28px rgba(0,0,0,.4); }
  .drawer-soal.terbuka{ transform:translateX(0); }
  .drawer-judul{ font-size:.78em; letter-spacing:.08em; text-transform:uppercase;
    color:rgba(255,255,255,.55); font-weight:700; margin-bottom:12px; }
  .drawer-legenda{ display:flex; align-items:center; gap:6px; font-size:.82em;
    color:rgba(255,255,255,.85); margin-bottom:16px; flex-wrap:wrap; }
  .legenda-dot{ width:14px; height:14px; border-radius:5px; background:transparent;
    border:1.5px solid rgba(255,255,255,.4); display:inline-block; margin-left:12px; }
  .legenda-dot:first-child{ margin-left:0; }
  .legenda-dot.terjawab{ background:#34D399; border-color:#34D399; }
  .drawer-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .drawer-grid .palet-btn{ width:100%; height:2.6em; background:rgba(255,255,255,.06);
    border-color:rgba(255,255,255,.18); color:#fff; }
  .drawer-grid .palet-btn.terjawab{ background:var(--blue-soft); border-color:#BAE6FD; color:var(--blue); }
  .status-simpan{ display:inline-flex; align-items:center; gap:.4em; font-size:.75em; font-weight:600; padding:.25em .7em; border-radius:99px; }
  .status-simpan.menyimpan{ background:var(--gold-soft); color:#7A5B00; }
  .status-simpan.tersimpan{ background:var(--blue-soft); color:var(--blue); }
  .status-simpan.gagal{ background:var(--red-soft); color:var(--red); cursor:pointer; border:1.5px solid var(--red); }
  .steps{ display:flex; align-items:center; gap:8px; margin-bottom:22px; }
  .step-dot{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.85em; border:1.5px solid var(--paper-line); }
  .step-dot.on{ background:var(--blue); color:white; border-color:var(--blue); }
  .step-line{ flex:1; height:1px; background:var(--paper-line); }
  .warn-box{ display:flex; gap:.6em; padding:14px 16px; border-radius:12px; background:var(--gold-soft); font-size:.85em; }
  .mat-status-banner{ display:none; align-items:center; gap:10px; padding:10px 14px; border-radius:12px;
    background:var(--gold-soft); font-size:.82em; margin-bottom:14px; line-height:1.4; }
  .qi{ border:none; padding:.15em 0; background:transparent; }
  .qi[readonly]{ color:var(--ink-soft); cursor:default; }
  .fmt-toolbar{ display:flex; gap:4px; margin-bottom:4px; }
  .fmt-btn{ font-family:inherit; width:26px; height:24px; line-height:1; padding:0; font-size:.82em;
    border:1.5px solid var(--paper-line); border-radius:6px; background:var(--card); color:var(--ink);
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  .fmt-btn:hover{ background:var(--paper); }
  .fmt-btn:active{ transform:translateY(1px); }
  .fmt-btn.b{ font-weight:700; }
  .fmt-btn.i{ font-style:italic; font-weight:600; }
  .fmt-btn.u{ text-decoration:underline; font-weight:600; }
  .mat-toolbar-row{ display:flex; gap:4px; flex-wrap:wrap; }
  .fmt-btn.tpl{ width:auto; min-width:30px; padding:0 6px; font-family:'IBM Plex Mono',monospace; }
  .fmt-btn.sym{ width:26px; font-family:'IBM Plex Mono',monospace; font-size:.9em; }
  .fmt-btn.sigma{ font-family:'IBM Plex Mono',monospace; font-weight:700; }
  .mat-panel{ display:none; position:absolute; top:calc(100% + 4px); left:0; z-index:30;
    flex-direction:column; gap:6px; background:var(--card); border:1.5px solid var(--paper-line);
    border-radius:10px; padding:8px; box-shadow:0 14px 32px -18px rgba(22,35,78,.35); width:max-content; max-width:260px; }
  .mat-panel.terbuka{ display:flex; }
  .gambar-soal{ max-width:100%; max-height:380px; object-fit:contain; border-radius:10px; margin-bottom:10px; display:block; background:var(--paper); border:1px solid var(--paper-line); }
  .gambar-editor{ max-width:100%; max-height:200px; object-fit:contain; border-radius:10px; display:block; border:1px solid var(--paper-line); }
  .gambar-opsi-editor{ max-width:100%; max-height:130px; object-fit:contain; border-radius:8px; display:block; border:1px solid var(--paper-line); background:var(--paper); }
  .gambar-opsi{ max-width:100%; max-height:220px; object-fit:contain; border-radius:8px; display:block; margin-top:6px; background:var(--paper); border:1px solid var(--paper-line); }
  details summary{ cursor:pointer; font-size:.85em; font-weight:600; color:var(--ink-soft); }

  /* =========================================================
     GERBANG MASUK (beranda, gerbang guru, masuk murid) — gaya kartu
     terpusat dengan lencana ikon, mirip referensi desain "login card".
     ========================================================= */
  .gerbang-card{ max-width:440px; width:100%; text-align:center; }
  .gerbang-badge{ width:64px; height:64px; border-radius:18px; margin:0 auto 18px;
    background:linear-gradient(135deg, var(--blue), var(--navy2)); display:flex; align-items:center;

  .gerbang-badge svg{ width:30px; height:30px; }

  .gerbang-bottom-sep{ color:var(--paper-line); font-size:.8em; }
  .gerbang-bottom-link{ display:inline-flex; align-items:center; gap:7px; background:transparent; border:none;
    cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:.92em; color:var(--ink);
    padding:6px 4px; }
  .gerbang-bottom-link:hover{ color:var(--blue); }
  .gerbang-bottom-link:active{ transform:translateY(1px); }
  .gerbang-bottom-link svg{ width:18px; height:18px; }
  .gerbang-bottom-link.guru svg{ color:#8A6100; }
  .gerbang-bottom-link.murid svg{ color:var(--blue); }
  .btn-icon svg{ width:15px; height:15px; display:block; }

  /* Kotak panduan 3 langkah di halaman depan (di bawah tombol "Masuk Ujian") */
  .guide-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:20px;
    padding-top:18px; border-top:1px solid var(--paper-line); text-align:left; }
  .guide-item{ font-size:.76em; color:var(--ink-soft); background:var(--paper); padding:10px 11px;
    border-radius:var(--radius-sm); border:1px solid var(--paper-line); }
  .guide-item strong{ display:block; color:var(--ink); margin-bottom:2px; font-size:.98em; }
  @media(max-width:560px){ .guide-grid{ grid-template-columns:1fr; } }

  /* Mode cetak (dipakai tombol "Ekspor PDF" di halaman Analitik Soal, lewat
     window.print()) — sembunyikan chrome aplikasi (header, tombol, dsb.),
     tampilkan HANYA konten bertanda .area-cetak dengan tampilan bersih. */
  .no-cetak{ }
  @media print {
    body{ background:#fff !important; }
    .header-wrap, .no-cetak{ display:none !important; }
    .wrap{ max-width:100% !important; padding:0 !important; }
    .card{ box-shadow:none !important; border:1px solid #ccc !important; break-inside:avoid; }
    a[href]::after{ content:""; }
  }
`;
document.head.appendChild(style);

/* =========================================================
   2b) NOTASI MATEMATIKA (KaTeX) — pemuatan tangguh + peringatan jelas
   Guru menulis rumus di antara tanda $...$ (sebaris) atau $$...$$ (blok),
   memakai kode LaTeX. Contoh: $\frac{1}{2}$, $\sqrt{16}$, $x^2$, $a_1$.

   Pustaka KaTeX dimuat lewat JavaScript (bukan tag <script> statis) supaya
   kalau gagal (mis. koneksi sekolah memblokir CDN, jaringan lambat), sistem
   otomatis MENCOBA ULANG beberapa kali. Kalau akhirnya tetap gagal, murid
   & guru diberi tahu lewat pesan jelas — bukan dibiarkan melihat kode
   mentah seperti "$\frac{1}{2}$" tanpa penjelasan apa pun.
   ========================================================= */
let statusKatex = "memuat"; // "memuat" | "siap" | "gagal"
const _dengarStatusKatex = [];
function daftarDengarKatex(fn) { _dengarStatusKatex.push(fn); }
function beriTahuStatusKatex(status) {
  statusKatex = status;
  _dengarStatusKatex.forEach((fn) => { try { fn(status); } catch (e) {} });
}

function muatSkripSekali(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Gagal memuat " + src));
    document.head.appendChild(s);
  });
}
function muatCssSekali(href) {
  return new Promise((resolve, reject) => {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = href;
    link.onload = () => resolve();
    link.onerror = () => reject(new Error("Gagal memuat " + href));
    document.head.appendChild(link);
  });
}

async function muatKatexDenganRetry(percobaanMaks) {
  const BASE = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9";
  for (let percobaan = 1; percobaan <= percobaanMaks; percobaan++) {
    try {
      await Promise.all([
        muatCssSekali(BASE + "/katex.min.css"),
        muatSkripSekali(BASE + "/katex.min.js").then(() => muatSkripSekali(BASE + "/contrib/auto-render.min.js")),
      ]);
      if (typeof window.renderMathInElement === "function") {
        beriTahuStatusKatex("siap");
        return;
      }
      throw new Error("renderMathInElement tidak tersedia setelah dimuat");
    } catch (err) {
      if (percobaan === percobaanMaks) {
        beriTahuStatusKatex("gagal");
        return;
      }
      await new Promise((r) => setTimeout(r, 1200 * percobaan)); // jeda makin lama tiap percobaan
    }
  }
}
muatKatexDenganRetry(3);

function renderMatematika(elemen) {
  if (!elemen) return;
  if (statusKatex === "siap") {
    try {
      window.renderMathInElement(elemen, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "\\[", right: "\\]", display: true },
          { left: "$", right: "$", display: false },
          { left: "\\(", right: "\\)", display: false },
        ],
        throwOnError: false,
      });
    } catch (e) { /* kalau gagal render, biarkan tampil sebagai teks biasa */ }
    return;
  }
  if (statusKatex === "memuat") {
    // begitu KaTeX siap, coba render ulang elemen ini sekali
    daftarDengarKatex((status) => { if (status === "siap") renderMatematika(elemen); });
  }
  // statusKatex === "gagal": dibiarkan tampil sebagai teks biasa;
  // penjelasan ke pengguna ditangani lewat banner (lihat elBannerKatex()).
}

const POLA_ADA_MATEMATIKA = /\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\$[^\$\n]+?\$|\\\([\s\S]*?\\\)/;

function isiBannerKatex(banner) {
  banner.innerHTML = "";
  if (statusKatex !== "gagal") { banner.style.display = "none"; return; }
  banner.style.display = "flex";
  banner.appendChild(el("span", { style: "font-size:1.1em;" }, "⚠️"));
  banner.appendChild(el("span", { style: "flex:1;" },
    "Notasi matematika (rumus) gagal dimuat — kemungkinan koneksi internet bermasalah atau diblokir jaringan. " +
    "Kalau ada soal yang menampilkan kode seperti ",
    el("span", { class: "mono" }, "$\\frac{...}{...}$"),
    " apa adanya, itu artinya rumusnya belum tampil rapi — bukan soal yang salah/rusak.",
    " "
  ));
  banner.appendChild(el("button", { class: "btn", style: "padding:.25em .7em; font-size:.8em; flex-shrink:0;", onclick: () => location.reload() }, "Muat Ulang Halaman"));
}
function elBannerKatex() {
  const banner = el("div", { class: "mat-status-banner", style: "display:none;" });
  isiBannerKatex(banner);
  daftarDengarKatex(() => isiBannerKatex(banner));
  return banner;
}

/* =========================================================
   2c) FORMAT TEKS (Tebal / Miring / Garis Bawah)
   Guru bisa memakai tombol B/I/U, yang menyisipkan tanda:
     **tebal**   →  cetak tebal
     *miring*    →  cetak miring
     __garis__   →  garis bawah
   Tanda ini disimpan apa adanya sebagai teks biasa (sama seperti rumus
   matematika), lalu baru diubah jadi tampilan tebal/miring/bergaris saat
   dirender — baik di pratinjau guru maupun di layar murid. Bagian yang
   berada di dalam rumus matematika ($...$ atau $$...$$) sengaja dilewati
   supaya tidak bentrok dengan kode LaTeX (mis. garis bawah pada indeks).

   TANDA DOLAR UNTUK MATA UANG (bukan rumus): kalau soal memuat nominal
   dolar sungguhan (mis. harga "$50"), tanda dolar itu bisa keliru dianggap
   pembuka/penutup rumus matematika oleh sistem — apalagi kalau ada LEBIH
   dari satu tanda dolar dalam satu kalimat/paragraf. Tulis "\$" (backslash
   lalu dolar) untuk tanda dolar sungguhan, supaya tidak dianggap rumus.
   Contoh: "Harga baju itu \$50, celana \$75." akan tampil sebagai
   "Harga baju itu $50, celana $75." apa adanya, tanpa dianggap rumus.
   ========================================================= */
function lolosHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* =========================================================
   1c) OPSI JAWABAN BERGAMBAR
   Setiap opsi jawaban (A/B/C/D) sekarang bisa berupa teks, gambar, atau
   keduanya — disimpan sebagai objek { teks, gambar, gambarFileId, gambarPublik }
   memakai nama field yang SAMA seperti gambar soal, supaya bisa memakai ulang
   fungsi upload gambar yang sudah ada tanpa duplikasi.
   ========================================================= */
function opsiKosong(teks) {
  return { teks: teks || "", gambar: "", gambarFileId: "", gambarPublik: false };
}
// Merapikan opsi lama (masih berupa string polos, dari sebelum fitur ini ada)
// menjadi bentuk objek yang konsisten — supaya asesmen lama tetap bisa dibuka/diedit.
function normalisasiOpsiFE(o) {
  if (typeof o === "string") return opsiKosong(o);
  return { teks: o.teks || "", gambar: o.gambar || "", gambarFileId: o.gambarFileId || "", gambarPublik: !!o.gambarPublik };
}
function opsiKosongTeksDanGambar(o) {
  return !(o && (o.teks || "").trim()) && !(o && o.gambar);
}
function pernyataanKosong() {
  return { teks: "", kunci: true };
}

function formatTeksKeHtml(teks) {
  if (!teks) return "";
  // Tanda "\$" (backslash + dolar) berarti "dolar sungguhan" (mis. harga
  // barang), BUKAN pembuka/penutup rumus matematika. Diganti dulu dengan
  // penanda sementara (karakter khusus, hampir mustahil diketik guru) supaya
  // tidak ikut cocok dengan pola pendeteksi rumus di bawah.
  const PENANDA_DOLAR_LITERAL = "\uE000";
  const teksAman = String(teks).split("\\$").join(PENANDA_DOLAR_LITERAL);
  const polaMatematika = /\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\$[^\$\n]+?\$|\\\([\s\S]*?\\\)/g;
  function formatBagianTeks(bagian) {
    // Tiap tanda dolar literal ditaruh di elemen <span> TERSENDIRI (bukan
    // sekadar karakter "$" polos). Ini penting: KaTeX melakukan pemindaian
    // KEDUA secara independen atas seluruh teks yang sudah jadi (lewat
    // renderMatematika), jadi kalau dua dolar literal cuma diganti balik
    // jadi karakter "$" biasa, keduanya bisa kembali dianggap sepasang
    // pembuka-penutup rumus oleh KaTeX — masalah yang sama persis muncul lagi.
    // Dengan membungkusnya di elemen terpisah, dolar literal tidak pernah
    // berada dalam satu node teks yang sama dengan dolar lain di sekitarnya.
    const potongan = bagian.split(PENANDA_DOLAR_LITERAL);
    return potongan.map((p, i) => {
      let t = lolosHtml(p);
      t = t.replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>");
      t = t.replace(/\*([^*]+?)\*/g, "<em>$1</em>");
      t = t.replace(/__([^_]+?)__/g, "<u>$1</u>");
      t = t.replace(/\n/g, "<br>");
      return i < potongan.length - 1 ? t + '<span class="dolar-literal">$</span>' : t;
    }).join("");
  }
  let hasil = "", terakhir = 0, m;
  while ((m = polaMatematika.exec(teksAman)) !== null) {
    hasil += formatBagianTeks(teksAman.slice(terakhir, m.index));
    hasil += lolosHtml(m[0].split(PENANDA_DOLAR_LITERAL).join("$"));
    terakhir = polaMatematika.lastIndex;
  }
  hasil += formatBagianTeks(teksAman.slice(terakhir));
  return hasil;
}

function terapkanFormat(inputEl, before, after, onSelesai) {
  const nilai = inputEl.value;
  const awal = inputEl.selectionStart ?? nilai.length;
  const akhir = inputEl.selectionEnd ?? nilai.length;
  const terpilih = nilai.slice(awal, akhir);
  const sudahDibungkus = terpilih.length >= before.length + after.length &&
    terpilih.startsWith(before) && terpilih.endsWith(after);
  let baru, kursorAwal, kursorAkhir;
  if (sudahDibungkus) {
    const isi = terpilih.slice(before.length, terpilih.length - after.length);
    baru = nilai.slice(0, awal) + isi + nilai.slice(akhir);
    kursorAwal = awal; kursorAkhir = awal + isi.length;
  } else {
    baru = nilai.slice(0, awal) + before + terpilih + after + nilai.slice(akhir);
    kursorAwal = awal + before.length;
    kursorAkhir = kursorAwal + terpilih.length;
  }
  inputEl.value = baru;
  inputEl.focus();
  inputEl.setSelectionRange(kursorAwal, kursorAkhir);
  onSelesai(baru);
}

/* =========================================================
   2d) TOOLBAR FORMAT TEKS + SIMBOL/RUMUS MATEMATIKA (satu baris ringkas)
   ---------------------------------------------------------
   Sebelumnya toolbar format (B/I/U) dan toolbar matematika (4 templat +
   15 simbol) masing-masing SELALU tampil sebagai baris tombolnya sendiri,
   sehingga di bawah tiap soal/pilihan jawaban muncul 3 baris tombol
   sekaligus — sangat memenuhi layar, apalagi saat ada 4 pilihan jawaban
   sekaligus (lihat laporan tangkapan layar).

   Sekarang digabung jadi SATU baris ringkas: [B] [I] [U] [Σ] — tombol Σ
   membuka panel kecil mengambang berisi templat & simbol matematika,
   hanya saat diklik, dan otomatis tertutup lagi setelah memilih sesuatu
   atau saat mengklik di luar panel. Cara pakainya sama persis seperti
   sebelumnya (klik simbol/templat untuk menyisipkannya) — yang berubah
   hanya tampilannya jadi jauh lebih ringkas.
   ========================================================= */
let _panelMatematikaTerbuka = null;
function tutupPanelMatematika() {

// Blok upload gambar yang bisa dipakai ulang — awalnya cuma untuk gambar soal,
// sekarang dipakai juga untuk gambar per-opsi jawaban. "objek" adalah soal atau
// opsi (keduanya punya field gambar/gambarFileId/gambarPublik yang sama).
function buatBlokGambar(objek, opts) {
  const status = el("p", { class: "muted", style: "font-size:.75em; margin:4px 0 0;" });
  const preview = objek.gambar
    ? el("div", { style: "margin-bottom:6px;" },

        }, "Hapus Gambar")
      )
    : el("span");
  const input = el("input", { type: "file", accept: "image/*" });
  input.addEventListener("click", (e) => e.stopPropagation());

      if (!hasil.ok) { status.textContent = hasil.error || "Gagal mengunggah gambar."; status.style.color = "var(--red)"; return; }
      objek.gambar = hasil.url;

  return blok;

function buatToolbarTeks(inputEl, onUbah) {
  // Penting: tombol format ini HARUS menjaga fokus tetap di inputEl-nya sendiri.
  // Kalau tidak dijaga, klik pada tombol bisa memindahkan fokus browser (atau
  // "nyasar" akibat render ulang yang terjadi tepat saat berpindah opsi
  // jawaban), sehingga selectionStart/End yang dibaca tidak lagi mewakili
  // seleksi guru yang sebenarnya — hasilnya tanda **** bisa tersisip nyasar
  // di ujung teks opsi yang SEBELUMNYA sedang diedit, bukan yang dimaksud.
  function jagaFokus(e) { e.preventDefault(); }
  function siapDipakai() { return document.activeElement === inputEl; }

  function tombolFmt(label, kelas, judul, before, after) {
    return el("button", {
      type: "button", class: `fmt-btn ${kelas}`, title: judul,
      onmousedown: jagaFokus,
      onclick: (e) => {
        e.preventDefault(); e.stopPropagation();
        if (!siapDipakai()) { inputEl.focus(); return; }
        terapkanFormat(inputEl, before, after, onUbah);
      }
    }, label);
  }
  function tombolTpl(label, judul, aksi) {
    return el("button", {
      type: "button", class: "fmt-btn tpl", title: judul,
      onmousedown: jagaFokus,
      onclick: (e) => {
        e.preventDefault(); e.stopPropagation();
        if (!siapDipakai()) { inputEl.focus(); return; }
        aksi(); tutupPanelMatematika();
      }
    }, label);
  }
  const panel = el("div", { class: "mat-panel" },
    el("div", { class: "mat-toolbar-row" },
      tombolTpl("a/b", "Sisipkan pecahan", () => sisipkanFrac(inputEl, onUbah)),
      tombolTpl("√", "Sisipkan bentuk akar", () => sisipkanSqrt(inputEl, onUbah)),
      tombolTpl("xⁿ", "Sisipkan pangkat", () => sisipkanPangkatIndeks(inputEl, "^", onUbah)),
      tombolTpl("xₙ", "Sisipkan indeks bawah", () => sisipkanPangkatIndeks(inputEl, "_", onUbah))
    ),
    el("div", { class: "mat-toolbar-row" },
      SIMBOL_MATEMATIKA.map((s) => el("button", {
        type: "button", class: "fmt-btn sym", title: `Sisipkan ${s}`,
        onmousedown: jagaFokus,
        onclick: (e) => {
          e.preventDefault(); e.stopPropagation();
          if (!siapDipakai()) { inputEl.focus(); return; }
          sisipkanSimbol(inputEl, s, onUbah); tutupPanelMatematika();
        }
      }, s))
    )
  );
  panel.addEventListener("click", (e) => e.stopPropagation());
  const tombolSigma = el("button", {
    type: "button", class: "fmt-btn sigma", title: "Simbol & rumus matematika (pecahan, akar, pangkat, dll)",
    onmousedown: jagaFokus,
    onclick: (e) => {
      e.preventDefault(); e.stopPropagation();
      const sudahTerbuka = panel.classList.contains("terbuka");
      tutupPanelMatematika();
      if (!sudahTerbuka) { panel.classList.add("terbuka"); _panelMatematikaTerbuka = panel; }
    }
  }, "Σ");
  const toolbarWrap = el("div", { class: "fmt-toolbar", style: "position:relative;" },
    tombolFmt("B", "b", "Tebal (bold)", "**", "**"),
    tombolFmt("I", "i", "Miring (italic)", "*", "*"),
    tombolFmt("U", "u", "Garis bawah (underline)", "__", "__"),
    tombolSigma,
    panel
  );
  // Jaga-jaga tambahan: kalau toolbar ini dipakai di dalam elemen yang bisa
  // diklik (mis. <label> pemilih jawaban benar), klik di mana pun pada
  // toolbar (termasuk celah antar tombol) TIDAK boleh ikut ditangkap oleh
  // elemen pembungkus di luarnya.
  toolbarWrap.addEventListener("click", (e) => e.stopPropagation());
  toolbarWrap.addEventListener("mousedown", (e) => e.stopPropagation());
  return toolbarWrap;
}

/* =========================================================
   2d) TOOLBAR SISIP SIMBOL & TEMPLAT MATEMATIKA
   Supaya guru tidak perlu menghafal kode LaTeX — tinggal klik.
   Simbol (×, π, ≤, dst.) disisipkan sebagai karakter biasa (langsung
   tampil tanpa perlu KaTeX). Templat (pecahan, akar, pangkat, indeks)
   menyisipkan kode LaTeX di dalam tanda $...$ dengan bagian yang perlu
   diisi otomatis tersorot, tinggal diketik ulang.
   ========================================================= */
function sisipkanSimbol(inputEl, simbol, onSelesai) {
  const nilai = inputEl.value;
  const awal = inputEl.selectionStart ?? nilai.length;
  const akhir = inputEl.selectionEnd ?? nilai.length;
  const baru = nilai.slice(0, awal) + simbol + nilai.slice(akhir);
  inputEl.value = baru;
  inputEl.focus();
  const posisi = awal + simbol.length;
  inputEl.setSelectionRange(posisi, posisi);
  onSelesai(baru);
}

function sisipkanFrac(inputEl, onSelesai) {
  const nilai = inputEl.value;
  const awal = inputEl.selectionStart ?? nilai.length;
  const akhir = inputEl.selectionEnd ?? nilai.length;
  const pembilang = nilai.slice(awal, akhir) || "a";
  const sisip = `$\\frac{${pembilang}}{b}$`;
  inputEl.value = nilai.slice(0, awal) + sisip + nilai.slice(akhir);
  inputEl.focus();
  const mulaiSorot = awal + "$\\frac{".length;
  inputEl.setSelectionRange(mulaiSorot, mulaiSorot + pembilang.length);
  onSelesai(inputEl.value);
}

function sisipkanSqrt(inputEl, onSelesai) {
  const nilai = inputEl.value;
  const awal = inputEl.selectionStart ?? nilai.length;
  const akhir = inputEl.selectionEnd ?? nilai.length;
  const isi = nilai.slice(awal, akhir) || "a";
  const sisip = `$\\sqrt{${isi}}$`;
  inputEl.value = nilai.slice(0, awal) + sisip + nilai.slice(akhir);
  inputEl.focus();
  const mulaiSorot = awal + "$\\sqrt{".length;
  inputEl.setSelectionRange(mulaiSorot, mulaiSorot + isi.length);
  onSelesai(inputEl.value);
}

function sisipkanPangkatIndeks(inputEl, operator, onSelesai) {
  const nilai = inputEl.value;
  const awal = inputEl.selectionStart ?? nilai.length;
  const akhir = inputEl.selectionEnd ?? nilai.length;
  const terpilih = nilai.slice(awal, akhir);
  let sisip, mulaiSorot, panjangSorot;
  if (terpilih) {
    sisip = `$${terpilih}${operator}{b}$`;
    mulaiSorot = awal + `$${terpilih}${operator}{`.length;
    panjangSorot = 1;
  } else {
    sisip = `$a${operator}{b}$`;
    mulaiSorot = awal + 1;
    panjangSorot = 1;
  }
  inputEl.value = nilai.slice(0, awal) + sisip + nilai.slice(akhir);
  inputEl.focus();
  inputEl.setSelectionRange(mulaiSorot, mulaiSorot + panjangSorot);
  onSelesai(inputEl.value);
}

const SIMBOL_MATEMATIKA = ["×","÷","±","≤","≥","≠","≈","π","∞","°","²","³","½","Δ","∑"];

async function panggilAPI(action, payload) {
  const body = { action, ...payload };
  if (AKSI_GURU_FE.includes(action) && body.sandi === undefined) body.sandi = sandiGuruTersimpan;
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body),
  });
  return res.json();
}

// Dipakai untuk menampilkan gambar soal MAUPUN gambar opsi ke murid/pratinjau.
// ---------------------------------------------------------------------
// URL cepat (drive.google.com/thumbnail) kadang gagal dimuat — paling sering
// terjadi pada OPSI bergambar, karena satu soal bisa memicu beberapa
// permintaan gambar ke Google Drive HAMPIR BERSAMAAN (tiap opsi + gambar
// soal), berbeda dengan gambar soal yang biasanya cuma satu per soal.
// Kalau itu terjadi, elemen <img> ini otomatis (lewat "onerror", TANPA guru
// atau murid perlu melakukan apa pun) meminta ulang gambarnya ke server
// sebagai base64 lewat aksi "ambilGambarBase64" — jalur ini selalu berhasil
// selama filenya masih ada di Drive, terlepas dari kebijakan berbagi publik.
function elGambarDenganCadangan(kelas, gambarObj, styleTambahan) {
  if (!gambarObj || !gambarObj.gambar) return el("span");
  const img = el("img", { class: kelas, src: gambarObj.gambar, style: styleTambahan || "" });
  let sudahDicoba = false;
  img.addEventListener("error", async () => {
    if (sudahDicoba || !gambarObj.gambarFileId) {
      img.replaceWith(el("p", { class: "muted", style: "font-size:.78em; font-style:italic;" }, "🖼️ Gambar gagal dimuat."));
      return;
    }
    sudahDicoba = true;
    try {
      const hasil = await panggilAPI("ambilGambarBase64", { fileId: gambarObj.gambarFileId });
      if (hasil.ok && hasil.dataUrl) img.src = hasil.dataUrl;
      else img.replaceWith(el("p", { class: "muted", style: "font-size:.78em; font-style:italic;" }, "🖼️ Gambar gagal dimuat."));
    } catch (err) {
      img.replaceWith(el("p", { class: "muted", style: "font-size:.78em; font-style:italic;" }, "🖼️ Gambar gagal dimuat."));
    }
  });
  return img;
}

function fmtWaktu(ms) {
  if (ms < 0) ms = 0;
  const t = Math.floor(ms / 1000);
  const m = String(Math.floor(t / 60)).padStart(2, "0");
  const s = String(t % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function masukLayarPenuh() {
  const target = document.documentElement;
  const fn = target.requestFullscreen || target.webkitRequestFullscreen || target.msRequestFullscreen;
  if (fn) {
    try { fn.call(target); } catch (e) { /* tidak didukung di perangkat ini, lanjut tanpa layar penuh */ }
  }
}
function keluarLayarPenuh() {
  const fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  const sedangFull = document.fullscreenElement || document.webkitFullscreenElement;
  if (fn && sedangFull) {
    try { fn.call(document); } catch (e) {}
  }
}

function resizeGambarKeDataUrl(file, maxLebar) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        if (width > maxLebar) {
          height = Math.round(height * (maxLebar / width));
          width = maxLebar;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = () => reject(new Error("Gagal membaca gambar."));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Gagal membaca file."));
    reader.readAsDataURL(file);
  });
}

function buatWatermarkDataUrl(teks) {
  const canvas = document.createElement("canvas");
  const lebar = 300, tinggi = 150;
  canvas.width = lebar; canvas.height = tinggi;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, lebar, tinggi);
  ctx.translate(lebar / 2, tinggi / 2);
  ctx.rotate(-28 * Math.PI / 180);
  ctx.font = "600 14px 'Plus Jakarta Sans', sans-serif";
  ctx.fillStyle = "rgba(27,42,74,0.11)";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(teks, 0, 0);
  return canvas.toDataURL("image/png");
}

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === "class") node.className = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else if (k === "html") node.innerHTML = v;
    // "value" HARUS di-set sebagai PROPERTY (node.value = v), bukan lewat
    // setAttribute. Untuk <input> keduanya kelihatan bekerja, tapi untuk
    // <textarea> setAttribute("value", ...) TIDAK berpengaruh sama sekali ke
    // isi yang ditampilkan — isi textarea hanya mengikuti property .value.
    // Sebelumnya ini membuat kotak soal (satu-satunya elemen <textarea> yang
    // diisi ulang dengan teks lama) tampak KOSONG setiap kali soal yang sudah
    // ada dibuka untuk diedit, walau datanya (s.teks) sebenarnya masih ada.
    else if (k === "value") node.value = v;
    else if (v !== undefined && v !== null) node.setAttribute(k, v);
  });
  children.flat().forEach((c) => {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(c) : c);
  });
  return node;
}

function halamanBeranda() {
  let assessment = null;
  const kodeInput = el("input", {
    class: "mono", maxlength: "6", placeholder: "KODE",
    style: "text-align:center; font-size:1.15em; letter-spacing:.3em; text-transform:uppercase;",
  });
  const errNode = el("p", { style: "color:var(--red); font-size:.85em; margin-top:8px;" });
  const bodyArea = el("div", {});

  function gambarCari() {
    bodyArea.innerHTML = "";
    bodyArea.appendChild(el("div", { style: "margin-bottom:14px;" }, kodeInput));
    bodyArea.appendChild(errNode);
    const tombol = el("button", { class: "btn btn-red btn-block", onclick: () => cari() }, "Masuk Ujian →");
    bodyArea.appendChild(tombol);
    bodyArea.appendChild(el("div", { class: "guide-grid" },
      el("div", { class: "guide-item" }, el("strong", {}, "1. Kode PIN"), "Dapatkan dari pengawas ujian."),
      el("div", { class: "guide-item" }, el("strong", {}, "2. Isi NIS"), "Gunakan NIS resmi terdaftar."),
      el("div", { class: "guide-item" }, el("strong", {}, "3. Otomatis"), "Jawaban tersimpan di server.")
    ));

    async function cari() {
      const kode = kodeInput.value.trim().toUpperCase();
      if (!kode) { errNode.textContent = "Isi kode terlebih dahulu."; return; }
      errNode.textContent = "";
      tombol.disabled = true; tombol.textContent = "Mencari…";
      const hasil = await panggilAPI("getStudentAssessment", { code: kode });
      tombol.disabled = false; tombol.textContent = "Masuk Ujian →";
      if (!hasil.ok) { errNode.textContent = hasil.error; return; }
      assessment = { ...hasil, code: kode };
      gambarPilihNama();
    }
    kodeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") cari(); });
  }

  function gambarPilihNama() {
    bodyArea.innerHTML = "";
    bodyArea.appendChild(el("div", { class: "gerbang-back" }, el("button", { class: "btn", onclick: gambarCari }, "← Ganti Kode")));
    bodyArea.appendChild(el("div", { style: "background:var(--paper); border-radius:5px; padding:12px 14px; margin-bottom:16px; text-align:left;" },
      el("div", { class: "row", style: "gap:.5em; align-items:baseline;" },
        el("div", { class: "disp", style: "font-size:1.2em;" }, assessment.mapel),
        assessment.jenjang ? el("span", { class: "stamp", style: "color:var(--ink-soft);" }, `Kelas ${assessment.jenjang}`) : el("span")
      ),
      el("div", { class: "muted", style: "font-size:.8em;" }, `${assessment.soal.length} soal · ${assessment.waktuMenit} menit`)
    ));

    const kelasUnik = [...new Set(assessment.siswa.map(s => s.kelas))];

    bodyArea.appendChild(el("label", { class: "field", style: "text-align:left;" }, "Pilih Kelas"));
    const kelasSelect = el("select", { style: "margin-bottom:14px;" });
    kelasUnik.forEach(k => kelasSelect.appendChild(el("option", { value: k }, k)));
    bodyArea.appendChild(kelasSelect);

    bodyArea.appendChild(el("label", { class: "field", style: "text-align:left;" }, "Pilih Namamu"));
    const namaSelect = el("select", { style: "margin-bottom:18px;" });
    function gambarNamaSelect() {
      namaSelect.innerHTML = "";
      assessment.siswa
        .filter(s => s.kelas === kelasSelect.value)
        .forEach(s => namaSelect.appendChild(el("option", { value: s.id }, s.nama)));
    }
    gambarNamaSelect();
    kelasSelect.addEventListener("change", gambarNamaSelect);
    bodyArea.appendChild(namaSelect);

    bodyArea.appendChild(el("button", { class: "btn btn-red btn-block", onclick: () => { masukLayarPenuh(); halamanMuridKerjakan(assessment, namaSelect.value); } }, "Mulai Mengerjakan"));
  }

  gambarCari();

  render(
    el("div", { class: "center" },
      el("div", { class: "card gerbang-card" },
        el("img", { src: LOGO_SEKOLAH_B64, alt: "Logo SMP N 1 Dlingo Bantul", class: "gerbang-logo" }),
        el("h2", { class: "disp gerbang-title" }, "Portal Asesmen Siswa"),
        el("p", { class: "gerbang-subtitle" }, "Masukkan Kode PIN Ujian dari Pengawas / Guru."),
        bodyArea
      )
    ),
    { headerRight: el("button", { class: "btn", style: "font-size:.85em; padding:8px 14px;", onclick: () => halamanGuruGerbang() }, "🔒 Login Guru") }
  );
}

/* =========================================================
   5) GURU — GERBANG SANDI (mengunci menu guru dari murid)
   ========================================================= */
function halamanGuruGerbang() {
  if (sandiGuruTersimpan) { halamanGuruBeranda(); return; }

  const sandiInput = el("input", { type: "password", class: "mono", placeholder: "Masukkan sandi guru…" });
  const errNode = el("p", { style: "color:var(--red); font-size:.85em; margin-top:10px;" });
  const btnMasuk = el("button", { class: "btn btn-red btn-block", style: "margin-top:4px;", onclick: () => cobaMasuk() }, "Masuk");

  async function cobaMasuk() {
    const sandi = sandiInput.value;
    errNode.textContent = "";
    if (!sandi) { errNode.textContent = "Isi sandi terlebih dahulu."; return; }
    btnMasuk.disabled = true;
    btnMasuk.textContent = "Memeriksa…";
    try {
      const hasil = await panggilAPI("cekSandi", { sandi });
      if (hasil.ok) {
        sandiGuruTersimpan = sandi;
        halamanGuruBeranda();
        return;
      } else {
        errNode.textContent = hasil.error || "Sandi salah.";
      }
    } catch (err) {
      errNode.textContent = "Gagal memeriksa sandi. Periksa koneksi internet.";
    }
    btnMasuk.disabled = false;
    btnMasuk.textContent = "Masuk";
  }
  sandiInput.addEventListener("keydown", (e) => { if (e.key === "Enter") cobaMasuk(); });

  render(
    el("div", { class: "center" },
      el("div", { class: "card gerbang-card" },
        el("div", { class: "gerbang-back" }, el("button", { class: "btn", onclick: halamanBeranda }, "← Kembali")),
        ikonEl(IKON.gembok, "gerbang-badge"),
        el("h2", { class: "disp gerbang-title" }, "Khusus Guru / Admin"),
        el("p", { class: "gerbang-subtitle" }, "Menu ini terkunci. Masukkan sandi guru untuk melanjutkan."),
        el("div", { class: "gerbang-field" }, ikonEl(IKON.gembok, ""), sandiInput),
        btnMasuk,
        errNode
      )
    )
  );
}

/* =========================================================
   6) GURU — BERANDA (daftar asesmen tersimpan di Spreadsheet)
   ========================================================= */
function halamanGuruBeranda() {
  if (!sandiGuruTersimpan) { halamanGuruGerbang(); return; }
  const kodeInput = el("input", { class: "mono", placeholder: "Masukkan kode asesmen…", maxlength: "6" });
  const daftarArea = el("div", {}, el("p", { class: "muted" }, "Memuat asesmen tersimpan…"));
  const cadanganArea = el("div", {}, el("p", { class: "muted", style: "font-size:.85em;" }, "Memuat status cadangan…"));

  render(
    el("div", { class: "wrap" },
      el("button", { class: "btn", style: "margin-bottom:20px;", onclick: halamanBeranda }, "← Kembali"),
      el("div", { class: "between", style: "margin-bottom:18px; flex-wrap:wrap; gap:10px;" },
        el("div", {},
          el("h2", { class: "disp", style: "margin:0;" }, "Asesmen Saya"),
          el("p", { class: "muted", style: "font-size:.85em;" }, "Tersimpan permanen di Google Spreadsheet — tetap ada meski kamu membuka ulang halaman ini.")
        ),
        el("button", { class: "btn btn-red", onclick: () => halamanBuatAsesmen() }, "+ Buat Asesmen Baru")
      ),
      daftarArea,
      el("div", { class: "card", style: "margin-top:18px;" },
        el("h3", { class: "disp", style: "margin-top:0; font-size:1.1em;" }, "Buka dengan Kode"),
        el("p", { class: "muted", style: "font-size:.85em; margin-bottom:12px;" }, "Kalau asesmen tidak muncul di daftar (mis. dibuat dari Spreadsheet lain), masukkan kodenya di sini."),
        el("div", { class: "row" },
          kodeInput,
          el("button", { class: "btn btn-primary", onclick: async () => {
            const kode = kodeInput.value.trim().toUpperCase();
            if (kode) halamanDashboard(kode);
          }}, "Buka Dashboard")
        )
      ),
      el("div", { class: "card", style: "margin-top:18px;" },
        el("h3", { class: "disp", style: "margin-top:0; font-size:1.1em;" }, "Cadangan Data"),
        el("p", { class: "muted", style: "font-size:.85em; margin-bottom:12px;" },
          "Seluruh soal, kunci jawaban, dan hasil siswa hanya hidup di satu Spreadsheet ini — kalau ada yang tidak sengaja terhapus atau rusak, cadangan ini jadi jalan pulihnya. Setiap cadangan adalah salinan LENGKAP Spreadsheet, disimpan di folder Drive terpisah \u201cAsesmen.ku - Cadangan\u201d. Cadangan lama dibuang otomatis, menyisakan 14 salinan terbaru."
        ),
        cadanganArea
      )
    )
  );

  function gambarCadangan(status) {
    cadanganArea.innerHTML = "";
    const waktuTeks = status.terakhirWaktu
      ? new Date(status.terakhirWaktu).toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" })
      : "Belum pernah ada cadangan.";
    cadanganArea.appendChild(el("div", { class: "row", style: "gap:.5em; align-items:baseline; flex-wrap:wrap; margin-bottom:10px;" },
      el("span", { class: "stamp", style: `color:${status.aktif ? "var(--green)" : "var(--ink-soft)"}` }, status.aktif ? "Cadangan Otomatis: Aktif (tiap jam 02:00)" : "Cadangan Otomatis: Nonaktif"),
    ));
    cadanganArea.appendChild(el("p", { class: "muted", style: "font-size:.8em; margin-bottom:14px;" }, `Cadangan terakhir: ${waktuTeks}${status.terakhirNama ? ` — ${status.terakhirNama}` : ""}`));

    const btnBackupNow = el("button", { class: "btn btn-primary", onclick: async () => {
      btnBackupNow.disabled = true; btnBackupNow.textContent = "Membuat cadangan…";
      const hasil = await panggilAPI("backupSekarang", {});
      btnBackupNow.disabled = false; btnBackupNow.textContent = "Cadangkan Sekarang";
      if (!hasil.ok) { alert(hasil.error || "Gagal membuat cadangan."); return; }
      muatStatusCadangan();
    }}, "Cadangkan Sekarang");

    const btnToggle = el("button", { class: "btn", onclick: async () => {
      btnToggle.disabled = true;
      const aksi = status.aktif ? "matikanCadanganOtomatis" : "aktifkanCadanganOtomatis";
      const hasil = await panggilAPI(aksi, {});
      btnToggle.disabled = false;
      if (!hasil.ok) { alert(hasil.error || "Gagal mengubah pengaturan cadangan otomatis."); return; }
      muatStatusCadangan();
    }}, status.aktif ? "Matikan Cadangan Otomatis" : "Aktifkan Cadangan Otomatis");

    cadanganArea.appendChild(el("div", { class: "row", style: "gap:8px; flex-wrap:wrap;" }, btnBackupNow, btnToggle));
  }

  function muatStatusCadangan() {
    panggilAPI("statusCadanganOtomatis", {}).then((status) => {
      if (!status.ok) {
        cadanganArea.innerHTML = "";
        cadanganArea.appendChild(el("p", { style: "color:var(--red); font-size:.85em;" }, status.error || "Gagal memuat status cadangan."));
        return;
      }
      gambarCadangan(status);
    }).catch(() => {
      cadanganArea.innerHTML = "";
      cadanganArea.appendChild(el("p", { style: "color:var(--red); font-size:.85em;" }, "Gagal terhubung ke server."));
    });
  }
  muatStatusCadangan();

  panggilAPI("listAssessments", {}).then((hasil) => {
    daftarArea.innerHTML = "";
    if (!hasil.ok) {
      daftarArea.appendChild(el("div", { class: "card" }, el("p", { style: "color:var(--red);" }, hasil.error || "Gagal memuat daftar asesmen.")));
      return;
    }
    if (!hasil.daftar.length) {
      daftarArea.appendChild(el("div", { class: "card", style: "text-align:center; padding:36px;" },
        el("p", { class: "muted" }, "Belum ada asesmen. Klik \u201c+ Buat Asesmen Baru\u201d untuk membuat asesmen pertamamu.")
      ));
      return;
    }
    const grid = el("div", { style: "display:grid; gap:10px;" });
    hasil.daftar.forEach((a) => {
      grid.appendChild(
        el("button", { class: "card between", style: "text-align:left; cursor:pointer; width:100%;", onclick: () => halamanDashboard(a.code) },
          el("div", {},
            el("div", { class: "row", style: "gap:.5em; align-items:baseline;" },
              el("div", { class: "disp", style: "font-size:1.2em;" }, a.mapel),
              a.jenjang ? el("span", { class: "stamp", style: "color:var(--ink-soft);" }, `Kelas ${a.jenjang}`) : el("span")
            ),
            el("div", { class: "muted", style: "font-size:.78em; margin-top:2px;" },
              `${a.jumlahSoal} soal · ${a.jumlahSiswa} siswa · ${a.waktuMenit} menit` +
              (a.createdAt ? ` · dibuat ${new Date(a.createdAt).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" })}` : "")
            )
          ),
          el("div", { style: "text-align:right; flex-shrink:0;" },
            el("div", { class: "mono", style: "font-size:1.1em; font-weight:700; color:var(--blue);" }, a.code),
            (() => {
              const LABEL = { terjadwal: "Terjadwal", aktif: "Aktif", dijeda: "Dijeda", ditutup: "Ditutup" };
              const WARNA = { terjadwal: "var(--gold)", aktif: "var(--green)", dijeda: "var(--gold)", ditutup: "var(--ink-soft)" };
              return el("span", { class: "stamp", style: `color:${WARNA[a.status] || "var(--ink-soft)"}` }, LABEL[a.status] || a.status);
            })()
          )
        )
      );
    });
    daftarArea.appendChild(grid);
  }).catch(() => {
    daftarArea.innerHTML = "";
    daftarArea.appendChild(el("div", { class: "card" }, el("p", { style: "color:var(--red);" }, "Gagal terhubung ke server.")));
  });
}

/* =========================================================
   6) GURU — FORM BUAT ASESMEN (wizard)
   ========================================================= */
function halamanBuatAsesmen(existing) {
  const modeEdit = !!(existing && existing.code);
  const state = modeEdit
    ? {
        langkah: 1,
        mapel: existing.mapel || "", waktuMenit: existing.waktuMenit || 30,
        jenjang: existing.jenjang || "7",
        acakSoal: !!existing.acakSoal, acakOpsi: !!existing.acakOpsi,
        jadwalMulai: existing.jadwalMulai || 0,
        wajibLengkap: !!existing.wajibLengkap,
        kelasList: [...new Set((existing.siswa || []).map(s => s.kelas))].length ? [...new Set((existing.siswa || []).map(s => s.kelas))] : ["7A"],
        siswa: (existing.siswa || []).map(s => ({ id: s.id, nama: s.nama, kelas: s.kelas })),
        soal: (existing.soal || []).map(s => ({
          id: s.id,
          teks: s.teks, opsi: (s.opsi || []).map(normalisasiOpsiFE), gambar: s.gambar || "", gambarFileId: s.gambarFileId || "",
          tipe: s.tipe || "pg",
          kunci: s.tipe === "pgk" ? (Array.isArray(s.kunci) ? s.kunci.slice() : []) : Number(s.kunci) || 0,
          bobot: Number(s.bobot) > 0 ? Number(s.bobot) : 1,
        })),
      }
    : {
        langkah: 1,
        mapel: "", waktuMenit: 30, jenjang: "7", acakSoal: true, acakOpsi: true,
        jadwalMulai: 0,
        wajibLengkap: false,
        kelasList: ["7A"],
        siswa: [],
        soal: [{ teks: "", opsi: [opsiKosong(), opsiKosong(), opsiKosong(), opsiKosong()], kunci: 0, tipe: "pg", bobot: 1 }],
      };
  const kembaliKe = modeEdit ? () => halamanDashboard(existing.code) : halamanGuruBeranda;

  function pesanValidasi(l) {
    if (l === 1) return state.mapel.trim() && state.waktuMenit > 0 && String(state.jenjang || "").trim() ? null : "Isi mapel, jenjang kelas, dan waktu terlebih dahulu.";
    if (l === 2) return state.siswa.length > 0 ? null : "Tambahkan minimal satu siswa.";
    if (l === 3) {
      const lengkap = state.soal.length && state.soal.every(s => {
        if (!s.teks.trim()) return false;
        if (s.tipe === "tbs") {
          return Array.isArray(s.pernyataan) && s.pernyataan.length >= 2 && s.pernyataan.every(p => p && p.teks && p.teks.trim());
        }
        return s.opsi.every(o => !opsiKosongTeksDanGambar(o)) &&
          (s.tipe === "pgk" ? Array.isArray(s.kunci) && s.kunci.length > 0 : true);
      });
      return lengkap ? null : "Lengkapi semua soal — untuk tipe Tabel Benar-Salah isi minimal 2 pernyataan, untuk tipe lain lengkapi semua pilihan jawaban (teks atau gambar) dan pastikan soal kompleks punya minimal satu jawaban benar.";
    }
    return null;
  }

  function gambar() {
    const langkahLabel = ["Detail", "Siswa", "Soal", "Tinjau"];
    const stepsRow = el("div", { class: "steps" });
    langkahLabel.forEach((l, i) => {
      stepsRow.appendChild(el("div", { class: `step-dot ${state.langkah === i + 1 ? "on" : ""}` }, String(i + 1)));
      if (i < langkahLabel.length - 1) stepsRow.appendChild(el("div", { class: "step-line" }));
    });

    let isi;
    if (state.langkah === 1) isi = langkah1();
    else if (state.langkah === 2) isi = langkah2();
    else if (state.langkah === 3) isi = langkah3();
    else isi = langkah4();

    const errNode = el("p", { style: "color:var(--red); font-size:.85em; margin-top:10px;" });

    const tombolBawah = el("div", { class: "between", style: "margin-top:20px;" },
      el("button", { class: "btn", disabled: state.langkah === 1 ? "true" : null, onclick: () => { state.langkah--; gambar(); } }, "Sebelumnya"),
      state.langkah < 4
        ? el("button", { class: "btn btn-primary", onclick: () => {
            const err = pesanValidasi(state.langkah);
            if (err) { errNode.textContent = err; return; }
            state.langkah++; gambar();
          }}, "Lanjut")
        : el("span")
    );

    render(
      el("div", { class: "wrap" },
        el("button", { class: "btn", style: "margin-bottom:20px;", onclick: kembaliKe }, "← Batal"),
        modeEdit ? el("span", { class: "stamp", style: "color:var(--gold); margin-bottom:14px; display:inline-block;" }, `Mengedit: ${existing.code}`) : el("span"),
        stepsRow,
        el("div", { class: "card" }, isi),
        errNode,
        tombolBawah
      )
    );
  }

  function langkah1() {
    const mapelInput = el("input", { value: state.mapel, oninput: (e) => state.mapel = e.target.value, placeholder: "mis. IPS, Matematika…" });
    const waktuInput = el("input", { type: "number", min: "1", value: state.waktuMenit, style: "max-width:140px;", oninput: (e) => state.waktuMenit = Number(e.target.value) });
    const cbSoal = el("input", { type: "checkbox", checked: state.acakSoal ? "checked" : null, onchange: (e) => state.acakSoal = e.target.checked });
    const cbOpsi = el("input", { type: "checkbox", checked: state.acakOpsi ? "checked" : null, onchange: (e) => state.acakOpsi = e.target.checked });
    const cbWajibLengkap = el("input", { type: "checkbox", checked: state.wajibLengkap ? "checked" : null, onchange: (e) => state.wajibLengkap = e.target.checked });

    const JENJANG_BAKU = ["7", "8", "9"];
    const jenjangSudahBaku = JENJANG_BAKU.includes(String(state.jenjang));
    const jenjangSelect = el("select", { style: "max-width:220px;" });
    JENJANG_BAKU.forEach(j => jenjangSelect.appendChild(el("option", { value: j, selected: state.jenjang === j ? "selected" : null }, `Kelas ${j}`)));
    jenjangSelect.appendChild(el("option", { value: "__lainnya__", selected: !jenjangSudahBaku ? "selected" : null }, "Lainnya…"));
    const jenjangManualInput = el("input", {
      value: jenjangSudahBaku ? "" : state.jenjang,
      placeholder: "mis. 10, 11, 12, atau nama jenjang lain",
      style: `margin-top:8px; ${jenjangSudahBaku ? "display:none;" : ""}`,
      oninput: (e) => state.jenjang = e.target.value,
    });
    jenjangSelect.addEventListener("change", (e) => {
      if (e.target.value === "__lainnya__") {
        state.jenjang = jenjangManualInput.value || "";
        jenjangManualInput.style.display = "block";
        jenjangManualInput.focus();
      } else {
        state.jenjang = e.target.value;
        jenjangManualInput.style.display = "none";
      }
    });

    // Jadwal mulai (opsional). Disimpan sebagai epoch ms; input datetime-local
    // selalu dalam zona waktu LOKAL perangkat guru, jadi konversinya cukup
    // lewat Date biasa (tanpa perlu urus offset manual).
    function keDatetimeLocal(epoch) {
      if (!epoch) return "";
      const d = new Date(epoch);
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    const jadwalInput = el("input", {
      type: "datetime-local", value: keDatetimeLocal(state.jadwalMulai), style: "max-width:260px;",
      oninput: (e) => { state.jadwalMulai = e.target.value ? new Date(e.target.value).getTime() : 0; },
    });
    const jadwalHapusBtn = el("button", { type: "button", class: "btn", style: "padding:.5em .9em;", onclick: () => { state.jadwalMulai = 0; jadwalInput.value = ""; } }, "Mulai Sekarang");

    return el("div", {},
      el("h3", { class: "disp", style: "margin-top:0;" }, "Detail Asesmen"),
      el("label", { class: "field" }, "Mata Pelajaran"),
      el("div", { style: "margin-bottom:16px;" }, mapelInput),
      el("label", { class: "field" }, "Jenjang Kelas"),
      el("div", { style: "margin-bottom:16px;" }, jenjangSelect, jenjangManualInput),
      el("label", { class: "field" }, "Waktu Pengerjaan (menit)"),
      el("div", { style: "margin-bottom:16px;" }, waktuInput),
      el("label", { class: "field" }, "Jadwalkan Mulai (opsional)"),
      el("div", { class: "row", style: "margin-bottom:6px;" }, jadwalInput, jadwalHapusBtn),
      el("p", { class: "muted", style: "font-size:.78em; margin-bottom:16px;" },
        "Kosongkan supaya asesmen langsung bisa diakses murid begitu dibuat. Kalau diisi, murid tidak akan bisa masuk sebelum waktu tersebut — status otomatis berubah jadi \"Aktif\" tepat pada waktunya, tanpa perlu kamu buka manual."
      ),

    function hapusKelas(k) {
      if (state.kelasList.length <= 1) { alert("Minimal harus ada 1 kelas di pilihan cepat."); return; }
      const jumlahSiswa = state.siswa.filter(s => s.kelas === k).length;
      if (jumlahSiswa > 0) {
        const lanjut = confirm(`${jumlahSiswa} siswa masih memakai kelas "${k}". Data siswa tidak akan dihapus/diubah, tapi kelas ini tidak akan muncul lagi di pilihan cepat. Lanjutkan menghapus?`);

    function unduhTemplateSiswa() {
      if (typeof XLSX === "undefined") {

      const jenjang = String(state.jenjang || "7").trim() || "7";

        ["Nama", "Kelas"],
        ["Andi Saputra", `${jenjang}A`],
        ["Bunga Lestari", `${jenjang}A`],
        ["Citra Dewi", `${jenjang}B`],
      ];
      const ws = XLSX.utils.aoa_to_sheet(data);
      ws["!cols"] = [{ wch: 28 }, { wch: 10 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Daftar Siswa");
      XLSX.writeFile(wb, `format-daftar-siswa-kelas-${jenjang}.xlsx`);
    }

    const tabelSiswa = el("div", {});

          el("td", {}, el("button", { class: "btn", style: "padding:.2em .5em; color:var(--red); border-color:var(--red)", onclick: () => { state.siswa.splice(i, 1); gambarTabelSiswa(); } }, "×"))
        ));
      });
      tbl.appendChild(tbody);
      tabelSiswa.appendChild(el("div", { style: "border:1px solid var(--paper-line); border-radius:5px; overflow:auto;" }, tbl));

      const n = namaInput.value.trim();

      namaInput.value = "";

      const file = excelInput.files[0];
      if (!file) return;
      if (typeof XLSX === "undefined") {
        excelStatus.textContent = "Pustaka pembaca Excel gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.";
        excelStatus.style.color = "var(--red)";
        return;
      }
      excelStatus.textContent = "Membaca file…";
      excelStatus.style.color = "var(--ink-soft)";
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: "array" });
          const sheetName = wb.SheetNames[0];
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "" });
          let mulaiDari = 0;
          if (rows.length) {
            const kolomA = String(rows[0][0] || "").trim().toLowerCase();
            const kolomB = String(rows[0][1] || "").trim().toLowerCase();
            if (kolomA.includes("nama") || kolomB.includes("kelas")) mulaiDari = 1;
          }
          let ditambah = 0;
          for (let i = mulaiDari; i < rows.length; i++) {
            const nama = String(rows[i][0] || "").trim();
            const kelas = String(rows[i][1] || "").trim() || kelasSelect.value;
            if (!nama) continue;
            if (!state.kelasList.includes(kelas)) state.kelasList.push(kelas);
            state.siswa.push({ nama, kelas });
            ditambah++;
          }
          if (ditambah > 0) {
            excelStatus.textContent = `${ditambah} siswa berhasil ditambahkan dari file.`;
            excelStatus.style.color = "var(--green)";
          } else {
            excelStatus.textContent = "Tidak ada baris nama yang terbaca. Pastikan Kolom A berisi nama siswa.";

        excelInput.value = "";
      };
      reader.readAsArrayBuffer(file);

    wrap.appendChild(el("p", { class: "muted", style: "font-size:.85em; margin-bottom:14px;" }, "Nama-nama ini muncul sebagai dropdown pilihan saat siswa masuk."));
    wrap.appendChild(el("p", { class: "muted", style: "font-size:.78em; margin:-8px 0 12px;" }, `Kotak "+ kelas" sudah diisi jenjang "${state.jenjang || "—"}" — tinggal tambahkan huruf bagian, mis. "${state.jenjang || "7"}A".`));

    wrap.appendChild(el("details", { style: "margin-bottom:10px;" },
      el("summary", {}, "Atau unggah file Excel (.xlsx / .xls / .csv)"),
      el("div", { style: "margin-top:8px;" },
        el("div", { class: "row", style: "align-items:center; gap:10px; margin-bottom:10px; padding:10px 12px; background:var(--paper); border-radius:8px;" },
          el("span", { class: "muted", style: "font-size:.8em; flex:1;" }, "Belum punya filenya? Unduh dulu format kosongnya, isi Nama & Kelas, lalu unggah lagi persis di bawah ini."),
          el("button", { type: "button", class: "btn", style: "font-size:.8em; padding:.45em .8em; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;", onclick: unduhTemplateSiswa },
            ikonEl(IKON.unduh, "btn-icon"), "Unduh Format"
          )
        ),
        el("p", { class: "muted", style: "font-size:.8em; margin-bottom:8px;" }, "Kolom A = Nama, Kolom B = Kelas. Baris pertama boleh judul kolom atau langsung data. Jika Kolom B kosong, siswa memakai kelas yang dipilih di dropdown atas."),
        excelInput,
        excelStatus
      )
    ));
    wrap.appendChild(el("details", { style: "margin-bottom:16px;" },
      el("summary", {}, "Atau tempel banyak nama sekaligus (Nama, Kelas per baris)"),
      el("div", { style: "margin-top:8px;" }, tempelArea),
      el("button", { class: "btn", style: "margin-top:8px;", onclick: () => {
        const baris = tempelArea.value.split("\n").map(b => b.trim()).filter(Boolean);
        baris.forEach(b => {
          const [nama, kelas] = b.split(",").map(x => x && x.trim());
          const k = kelas || kelasSelect.value;
          if (!state.kelasList.includes(k)) state.kelasList.push(k);
          state.siswa.push({ nama: nama || b, kelas: k });
        });
        tempelArea.value = "";
        gambarKelasChip(); gambarKelasSelect(); gambarTabelSiswa();
      }}, "Tambahkan dari tempelan")
    ));
    wrap.appendChild(tabelSiswa);
    gambarTabelSiswa();
    return wrap;
  }
